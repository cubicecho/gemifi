  - { id: num_1_led, name: "1", pin: { tm1628: leds_a, number: 99 } }
  - { id: num_2_led, name: "2", pin: { tm1628: leds_a, number: 100 } }
  - { id: num_3_led, name: "3", pin: { tm1628: leds_a, number: 101 } }
  - { id: num_4_led, name: "4", pin: { tm1628: leds_a, number: 102 } }
  - { id: b1_led, name: "B1", pin: { tm1628: leds_b, number: 32 }, pin2: { tm1628: leds_b, number: 16 }, pin3: { tm1628: leds_b, number: 0 } }
  - { id: b2_led, name: "B2", pin: { tm1628: leds_b, number: 33 }, pin2: { tm1628: leds_b, number: 17 }, pin3: { tm1628: leds_b, number: 1 } }

# yaml-language-server: $schema=https://cubicecho.github.io/gemifi/schema/device.json
# DIY test device: an ESP32-WROOM-32 DevKitC, one 10k pot and a 0.96" 128x64 SSD1306 I2C OLED.
#
# Wiring (core/README.md "Displays"):
#   pot:  one end to 3V3, the other to GND, the wiper to GPIO34 (ADC1, input-only)
#   OLED: VCC to 3V3, GND to GND, SDA to GPIO25, SCL to GPIO27 (the module has its pull-ups)
#
# MIDI goes over the board's USB-UART at 115200 baud (midi.transport serial: the classic ESP32 has no
# native USB). The web updater talks to it over Web Serial; for a DAW, bridge it to a MIDI port
# (ttymidi -s /dev/ttyUSB0 -b 115200 on Linux, Hairless MIDI on Windows / macOS).
gemifi: 2
name: diy-esp32-pot-oled
friendly_name: DIY ESP32 Pot + OLED
description: ESP32 DevKitC test device, 1 pot (CC 7), a 128x64 SSD1306 OLED showing the last message
board_id: 0x3F18               # 0x3F00-0x3FFF: DIY / private (protocol/sysex.md section 7)
platform: esp32
chip: esp32dev                 # PlatformIO board id (ESP32-WROOM-32 DevKitC)
midi: { transport: serial }
scan_interval: 1ms

i2c: { sda: GPIO25, scl: GPIO27 }

ssd1306:
  - id: oled
    address: 0x3C              # 0x78 on the board's silkscreen is the same address, 8-bit
    # model: sh1106            # for the 1.3" modules
    # rotate: 180              # if the text is upside down

analog:
  - { id: pot, name: Volume, pin: GPIO34, cc: 7 }

displays:
  # big: the last MIDI message ("7 127" as the pot turns) and the device's messages
  - { id: oled_main, ssd1306: oled, line: 1, scale: 2, shows: last_message }
  # small, along the bottom: the MIDI channel
  - { id: oled_channel, ssd1306: oled, line: 6, shows: channel }

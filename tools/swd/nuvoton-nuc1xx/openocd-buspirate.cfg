# Bus Pirate v3.6 (fw 5.10) -> Keystation Mini 32 MK3 (Nuvoton NUC120LC1BN) over SWD.
# Use:  openocd -s tools/swd/nuvoton-nuc1xx -f openocd-buspirate.cfg ...   (the scripts here do this)
# Wiring (verified 2026-10-30):
#   BP MOSI -> TP1 = ICE_DAT (U1 pin 29)
#   BP CLK  -> TP2 = ICE_CK  (U1 pin 30)
#   BP GND  -> TP4 = GND
#   BP Vpu, +3.3V, +5V -> NOT connected (the keyboard back-powered the Bus Pirate through them)
# Keyboard powered from USB; Bus Pirate supply (vreg) off.
# Power order: plug the Bus Pirate in FIRST and the keyboard LAST; unplug the keyboard FIRST.
# The FTDI latency timer must be 1 ms (udev rule; see tools/README.md).
# Note: OpenOCD 0.12's buspirate driver ignores "mode open-drain" in SWD mode and drives 3.3 V push-pull.
# Override the port with:  -c "set BP_PORT /dev/ttyUSB1"  before -f.
if {![info exists BP_PORT]} { set BP_PORT /dev/ttyUSB0 }
adapter driver buspirate
buspirate port $BP_PORT
buspirate speed normal
buspirate mode open-drain
buspirate pullup 0
buspirate vreg 0
transport select swd
adapter speed 100

source [find nuc1xx-target.cfg]

# yaml-language-server: $schema=https://cubicecho.github.io/gemifi/schema/device.json
# M-Audio Code 61 with gemifi (STM32F103RBT6, confirmed on hardware 2026-11-03).
# Runs under the gemifi bootloader (bootloader/stm32f1). Working on hardware
# (2026-11-03): keys with velocity, panel buttons, encoders, faders, wheels,
# aftertouch, the XY pad, pads with their LEDs, the button LEDs (lit while
# idle), the display (preset names, "CH <n>"), the rear MIDI jacks, presets on
# Up / Down (Channel held: the MIDI channel), the soft power button (hold 2 s
# to switch off) and settings saving. Values still tagged [guess] below are
# untuned. DAW scripts (Bitwig, Live; hosts/README.md) find the transport,
# faders, encoders and B1-B9 by their daw: roles; without a script those send
# their CCs as usual. B1-B9 mute (white, blue while muted); Shift + Button
# mode switches B2-B9 to record arm (red while armed) and back (modes: arm,
# untested on hardware). Shift + Pad octave - turns the pads into a clip grid
# for a DAW script (modes: pads), Shift + Encoder mode steps the encoders
# through MIDI / ZYN / DEVICE / PAN (modes: encoders); the three are
# independent. The display shows what a DAW script sends it (daw: param).
# The layers are untested on hardware.
# Pins come from static analysis of the Code 49 v1.2.1 app, re-checked on the
# Code 61 v1.2.2 app (same pin setup): research/devices/m-audio-code61/analysis/hw-map.md
#
# Confidence tags on each pin:
#   [sure]   read directly from the stock app's GPIO and ADC setup
#   [likely] the setup is clear, but what the pin is for is inferred
#   [guess]  needs a board photo or a hardware test
#
# The matrix (hw-map.md §2, §9): rows come from 3-to-8 decoders on PB3-PB5
# (address) and PB6/PB7 (group: PB6=1 rows 0-7, PB7=1 rows 8-15, both 0 rows
# 16-23); columns are PB8-PB15, pull-up, active-low. Keys on rows 0-15 (two
# contacts on rows 2k / 2k+1), panel buttons on rows 16-20, encoders on 21-22.
#
# TODO: hardware the core can't describe yet, so it is left out here:
#   - PB0 (ch8): most likely the rear "volume" (expression pedal) jack.
#   - USB D+ pull-up switch on PA8 (high = connected): driven by the platform.
#   - No boot_combo here: up + down at power-on is the bootloader's update
#     mode (bootloader/stm32f1), checked before the app runs.
gemifi: 2
name: m-audio-code61
friendly_name: Code 61
description: "M-Audio Code 61 (STM32F103): keys, panel, encoders, faders, wheels, aftertouch, XY pad, pads, LEDs, display, MIDI jacks and presets"
project:
  version: 0.2.97
board_id: 0x0002
platform: stm32f1
chip: STM32F103RB          # [sure] STM32F103RBT6 (chip marking, SWD IDCODE 0x20036410)
usb: { vid: 0x1209, pid: 0x0002 }
# Recovery (core/README.md "Factory-reset combo", "Physical unlock", "Status LED"):
# Octave - + Octave + held at power-up for 5 s wipe the settings (not the firmware;
# Up + Down at power-up is the bootloader's). The Edit LED shows the blink codes.
# The physical unlock is off. With the line below, uploads, reboot to the bootloader
# and factory reset over SysEx wait until Up + Down are held for 2 s (the display says
# HOLD UP+DOWN and the Edit LED blinks fast meanwhile).
factory_reset_combo: [octave_down, octave_up]
# unlock: { combo: [up, down] }
status_led: edit_led
# write_to_flash: (core/README.md "Writes the device makes on its own"): what
# the device stores without a host asking. Left out = off: a preset picked on
# the device isn't remembered, and power-up is preset 1. A flash page erase
# stalls the scan for 20-40 ms, so the write waits until nothing is played.
# Saves from the web page or gemifi.py always work.
# write_to_flash:
#   last_preset: true   # power up on the preset used last
#   delay: 10s          # after the last switch (default)
#   idle: 3s            # and once nothing has been played for this long (default)
# Scan time on hardware (fw 0.2.6): ~170 us on average for the 16 key rows,
# the panel/encoder rows (every other tick) and the encoders. 400 us leaves the
# main loop (USB, pads, faders) more than half the CPU, and matches the stock
# firmware's key timing resolution (its key timestamps advance every 400 us).
scan_interval: 400us
# hardware_scan: (core/README.md "Hardware scan"): timers + DMA do the
# scanning, the CPU only looks at the results.
# matrix: keys, panel buttons and encoders (23 decoder rows on the PB8-PB15
# columns), by TIM1 + DMA: no CPU per row, and a key's two contacts are
# timed to the frame (23 rows, padded to 24, x row_time = 36 us), not the
# 400 us tick above. precharge drives the columns high between rows like
# the stock firmware, so the read only waits for a closed key to pull a
# column down: 1 us is enough (tried 2026-11-03, builds 44-48: no ghost or
# missing notes with chords and fast runs). Without precharge the columns
# need about 3 us to come back up: `row_time: 3.5us, settle: 3us` (84 us).
# Remove a part to go back to the software scan for it.
# analog: faders and pads, by TIM4 + ADC1 + DMA: TIM4 steps the three muxes'
# shared select lines (PC0-PC2) and, after their 4 us delay, starts ADC1 on
# PA7, PA6, PA1 and PA0; a sweep of all 8 steps takes 200 us. Pads see
# their strongest reading since the last pass, faders are read every 1 ms
# (each was every 18 ms), and the main loop does no ADC work at all.
hardware_scan:
  matrix:
    row_time: 1.5us
    settle: 1us
    precharge: true
  analog: true

# Analog mux for faders: 8:1, select lines PC0-PC2 [sure], common on PA7 = ADC ch7 [sure].
# No enable line is set by the stock app. The pads use the same select lines
# on two more muxes (PA0, PA1, below): allow_other_uses on every use.
cd74hc4051:
  - id: fader_mux
    pin_s0: { number: PC0, allow_other_uses: true }   # [sure] GPIOC ODR bits 0-2 = mux step (0x080027D0)
    pin_s1: { number: PC1, allow_other_uses: true }   # [sure]
    pin_s2: { number: PC2, allow_other_uses: true }   # [sure]
    common_pin: PA7        # [sure] ADC rank 6 = ch7; mux step n -> fader slot n+1 (0x08002A5C)
    delay: 4us             # [guess] the stock app waits a whole ADC frame after switching
  # Pad muxes: mux step n = pad slot n on PA0 (ADC ch0), slot n + 8 on PA1 (ch1) [sure].
  # Keep delay: the same on muxes that share select lines.
  - id: pad_mux_a
    pin_s0: { number: PC0, allow_other_uses: true }   # [sure]
    pin_s1: { number: PC1, allow_other_uses: true }   # [sure]
    pin_s2: { number: PC2, allow_other_uses: true }   # [sure]
    common_pin: PA0        # [sure] ADC rank 1 = ch0
    delay: 4us             # [guess]
  - id: pad_mux_b
    pin_s0: { number: PC0, allow_other_uses: true }   # [sure]
    pin_s1: { number: PC1, allow_other_uses: true }   # [sure]
    pin_s2: { number: PC2, allow_other_uses: true }   # [sure]
    common_pin: PA1        # [sure] ADC rank 2 = ch1
    delay: 4us             # [guess]

# LED drivers: two TM1628-class chips, bit-banged, sharing CLK and DIO, each
# with its own STB [sure] (hw-map.md "LEDs and display"). Together they drive
# every LED and the 6-character display. A pin on them is a RAM bit:
# number = byte * 8 + bit. PA15 is a JTAG pin at reset; the board config
# turns JTAG off (BOARD_SWJ_NOJTAG, SWD stays on).
# The stock app never sends a display-mode command (no grids:), and its
# brightness is unknown (intensity: 7 = the default). [guess]
tm1628:
  - id: leds_a             # 14 RAM bytes, the TM1628 size [sure]
    clk_pin: { number: PC10, allow_other_uses: true }
    dio_pin: { number: PC11, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: PA15
    ram_bytes: 14
  - id: leds_b             # the stock app writes 6 bytes [sure]
    clk_pin: { number: PC10, allow_other_uses: true }
    dio_pin: { number: PC11, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: PC12
    ram_bytes: 6
# Pad LEDs: not on the TM1628s but on the pad board, a small controller fed by
# USART2 TX on PA2 at 115200 baud [sure, found in the stock app and tried
# 2026-11-03]: one message per LED, 02, 0x80 + LED, R, G, B, 03, and an A5
# keepalive (core/README.md "RGB serial LEDs"). Its LED index counts from the
# top row, like the pad mux slots: pad k (1 = bottom left) is LED
# (3 - (k-1) / 4) * 4 + (k-1) % 4. The board answers each LED message with
# 0x40 + LED on PA3 [sure, logged on hardware 2026-11-09]: rx_pin lets the
# core resend what wasn't answered and repaint once the board is up.
rgb_serial:
  - id: pad_leds
    tx_pin: PA2
    rx_pin: PA3
    # Calibrated by eye on the Code 61 (2026-11-09, test builds 98-99): the
    # LEDs dim smoothly (8-bit PWM), a 64 looks about half of 255 (gamma),
    # and 255/255/255 looks green: 255/200/220 looks white.
    gamma: 2.2
    white: [255, 200, 220]
    count: 16

# The rear 5-pin MIDI jacks [sure pins, hw-map.md: USART1 at 31250 baud, TX
# PA9, RX PA10]. The stock firmware only sends to MIDI Out; here MIDI In
# also reaches the computer and the computer can play MIDI Out, on the main
# USB port (usb_merge; midi.usb_to_din), with an optional thru (midi.thru,
# off at first). mode: separate_port would give the jacks a USB port of their
# own ("Code 61 MIDI"), but two ports hang Chrome's Web MIDI on Windows for
# now (tested 2026-11-03, builds 69/71 hang, 70 doesn't).
din_midi:
  tx_pin: PA9
  rx_pin: PA10
  mode: usb_merge
  usb_to_din: true   # the computer's notes/CCs on the main port also play MIDI Out

# The XY pad, a 4-wire resistive panel [sure, tested 2026-11-03; drive
# pattern from the stock app, 0x0800277C]: X (left to right) is PC4 high and
# PB2 low, read on PC5 (ch15); Y (bottom to top) is PB1 high and PC5 low, read
# on PC4 (ch14). The stock app counts a touch while both read inside
# 0x250..0xD50 (592..3408) +- 22, the default touch window here.
xy_pad:
  - id: xy
    x_plus_pin: PC4
    x_minus_pin: PB2
    y_plus_pin: PB1
    y_minus_pin: PC5

# The 6-character 14-segment display, on chip A (leds_a) [sure, mapped
# 2026-11-03]: each character is 16 RAM bits (2 bytes): bits 0-13 are
# segments a b c d e f g1 g2 h i j k l m (core/include/gm_display.h), bit 14
# its dot, bit 15 unused. Left to right the characters start at bits 48, 64,
# 80, 0, 16, 32 (bytes 6, 8, 10, 0, 2, 4).
displays:
  - id: display
    type: segment14
    daw: param             # a DAW script's text: the control being moved, the chain name
    chars:
      - { tm1628: leds_a, number: 48 }
      - { tm1628: leds_a, number: 64 }
      - { tm1628: leds_a, number: 80 }
      - { tm1628: leds_a, number: 0 }
      - { tm1628: leds_a, number: 16 }
      - { tm1628: leds_a, number: 32 }

# LEDs, mapped on hardware (2026-11-03) with the LED-map build
# (devices/m-audio-code61-ledmap.yaml). Chip A bits 0-95 are the display
# (see the TODO at the top); bits 96-102 are single-colour button LEDs.
# Chip B bit n (0-15) is an RGB LED's blue, n+16 its green, n+32 its red.
# Shift has no LED [sure, 2026-11-03]: every LED-driver bit, the pad board's
# LEDs 16-31 and the unused GPIOs (PC6-8, PC14, PD2) lit nothing on it, and
# the stock app drives no other outputs (it sends the pad board LEDs 0-15 only).
# Looks (core/README.md "LED looks"), the user's request (2026-11-03): every
# LED lit while idle so the panel is easy to see, and changed while active.
# RGB LEDs (buttons, pads) idle blue and go white; the single-colour ones
# (Channel, Edit, Zone, 1-4) are lit and go dark. Change them here, or per
# LED with idle: / active:.
led_defaults: { idle: blue, active: white }
leds:
  - { id: channel_led, name: "Channel", pin: { tm1628: leds_a, number: 96 } }
  - { id: edit_led, name: "Edit", pin: { tm1628: leds_a, number: 97 } }
  - { id: zone_led, name: "Zone", pin: { tm1628: leds_a, number: 98 } }
  - { id: num_1_led, name: "1", pin: { tm1628: leds_a, number: 99 } }
  - { id: num_2_led, name: "2", pin: { tm1628: leds_a, number: 100 } }
  - { id: num_3_led, name: "3", pin: { tm1628: leds_a, number: 101 } }
  - { id: num_4_led, name: "4", pin: { tm1628: leds_a, number: 102 } }
  - { id: b1_led, name: "B1", pin: { tm1628: leds_b, number: 32 }, pin2: { tm1628: leds_b, number: 16 }, pin3: { tm1628: leds_b, number: 0 }, idle: white, active: blue }
  - { id: b2_led, name: "B2", pin: { tm1628: leds_b, number: 33 }, pin2: { tm1628: leds_b, number: 17 }, pin3: { tm1628: leds_b, number: 1 }, idle: white, active: blue }
  - { id: b3_led, name: "B3", pin: { tm1628: leds_b, number: 34 }, pin2: { tm1628: leds_b, number: 18 }, pin3: { tm1628: leds_b, number: 2 }, idle: white, active: blue }
  - { id: b4_led, name: "B4", pin: { tm1628: leds_b, number: 35 }, pin2: { tm1628: leds_b, number: 19 }, pin3: { tm1628: leds_b, number: 3 }, idle: white, active: blue }
  - { id: b5_led, name: "B5", pin: { tm1628: leds_b, number: 36 }, pin2: { tm1628: leds_b, number: 20 }, pin3: { tm1628: leds_b, number: 4 }, idle: white, active: blue }
  - { id: b6_led, name: "B6", pin: { tm1628: leds_b, number: 37 }, pin2: { tm1628: leds_b, number: 21 }, pin3: { tm1628: leds_b, number: 5 }, idle: white, active: blue }
  - { id: b7_led, name: "B7", pin: { tm1628: leds_b, number: 38 }, pin2: { tm1628: leds_b, number: 22 }, pin3: { tm1628: leds_b, number: 6 }, idle: white, active: blue }
  - { id: b8_led, name: "B8", pin: { tm1628: leds_b, number: 39 }, pin2: { tm1628: leds_b, number: 23 }, pin3: { tm1628: leds_b, number: 7 }, idle: white, active: blue }
  - { id: b9_led, name: "B9", pin: { tm1628: leds_b, number: 40 }, pin2: { tm1628: leds_b, number: 24 }, pin3: { tm1628: leds_b, number: 8 }, idle: white, active: blue }
  - { id: button_mode_led, name: "Button mode", pin: { tm1628: leds_b, number: 41 }, pin2: { tm1628: leds_b, number: 25 }, pin3: { tm1628: leds_b, number: 9 }, idle: blue, active: red }
  - { id: bank_left_led, name: "Bank left", pin: { tm1628: leds_b, number: 42 }, pin2: { tm1628: leds_b, number: 26 }, pin3: { tm1628: leds_b, number: 10 } }
  - { id: bank_right_led, name: "Bank right", pin: { tm1628: leds_b, number: 43 }, pin2: { tm1628: leds_b, number: 27 }, pin3: { tm1628: leds_b, number: 11 } }
  - { id: fader_mode_led, name: "Fader mode", pin: { tm1628: leds_b, number: 44 }, pin2: { tm1628: leds_b, number: 28 }, pin3: { tm1628: leds_b, number: 12 } }
  - { id: encoder_mode_led, name: "Encoder mode", pin: { tm1628: leds_b, number: 45 }, pin2: { tm1628: leds_b, number: 29 }, pin3: { tm1628: leds_b, number: 13 }, idle: blue, active: red }
  - { id: x_mode_led, name: "X mode", pin: { tm1628: leds_b, number: 46 }, pin2: { tm1628: leds_b, number: 30 }, pin3: { tm1628: leds_b, number: 14 } }
  - { id: y_mode_led, name: "Y mode", pin: { tm1628: leds_b, number: 47 }, pin2: { tm1628: leds_b, number: 31 }, pin3: { tm1628: leds_b, number: 15 } }
  - { id: pad_1_led, name: "Pad 1", pin: { rgb_serial: pad_leds, number: 36 }, pin2: { rgb_serial: pad_leds, number: 37 }, pin3: { rgb_serial: pad_leds, number: 38 } }
  - { id: pad_2_led, name: "Pad 2", pin: { rgb_serial: pad_leds, number: 39 }, pin2: { rgb_serial: pad_leds, number: 40 }, pin3: { rgb_serial: pad_leds, number: 41 } }
  - { id: pad_3_led, name: "Pad 3", pin: { rgb_serial: pad_leds, number: 42 }, pin2: { rgb_serial: pad_leds, number: 43 }, pin3: { rgb_serial: pad_leds, number: 44 } }
  - { id: pad_4_led, name: "Pad 4", pin: { rgb_serial: pad_leds, number: 45 }, pin2: { rgb_serial: pad_leds, number: 46 }, pin3: { rgb_serial: pad_leds, number: 47 } }
  - { id: pad_5_led, name: "Pad 5", pin: { rgb_serial: pad_leds, number: 24 }, pin2: { rgb_serial: pad_leds, number: 25 }, pin3: { rgb_serial: pad_leds, number: 26 } }
  - { id: pad_6_led, name: "Pad 6", pin: { rgb_serial: pad_leds, number: 27 }, pin2: { rgb_serial: pad_leds, number: 28 }, pin3: { rgb_serial: pad_leds, number: 29 } }
  - { id: pad_7_led, name: "Pad 7", pin: { rgb_serial: pad_leds, number: 30 }, pin2: { rgb_serial: pad_leds, number: 31 }, pin3: { rgb_serial: pad_leds, number: 32 } }
  - { id: pad_8_led, name: "Pad 8", pin: { rgb_serial: pad_leds, number: 33 }, pin2: { rgb_serial: pad_leds, number: 34 }, pin3: { rgb_serial: pad_leds, number: 35 } }
  - { id: pad_9_led, name: "Pad 9", pin: { rgb_serial: pad_leds, number: 12 }, pin2: { rgb_serial: pad_leds, number: 13 }, pin3: { rgb_serial: pad_leds, number: 14 } }
  - { id: pad_10_led, name: "Pad 10", pin: { rgb_serial: pad_leds, number: 15 }, pin2: { rgb_serial: pad_leds, number: 16 }, pin3: { rgb_serial: pad_leds, number: 17 } }
  - { id: pad_11_led, name: "Pad 11", pin: { rgb_serial: pad_leds, number: 18 }, pin2: { rgb_serial: pad_leds, number: 19 }, pin3: { rgb_serial: pad_leds, number: 20 } }
  - { id: pad_12_led, name: "Pad 12", pin: { rgb_serial: pad_leds, number: 21 }, pin2: { rgb_serial: pad_leds, number: 22 }, pin3: { rgb_serial: pad_leds, number: 23 } }
  - { id: pad_13_led, name: "Pad 13", pin: { rgb_serial: pad_leds, number: 0 }, pin2: { rgb_serial: pad_leds, number: 1 }, pin3: { rgb_serial: pad_leds, number: 2 } }
  - { id: pad_14_led, name: "Pad 14", pin: { rgb_serial: pad_leds, number: 3 }, pin2: { rgb_serial: pad_leds, number: 4 }, pin3: { rgb_serial: pad_leds, number: 5 } }
  - { id: pad_15_led, name: "Pad 15", pin: { rgb_serial: pad_leds, number: 6 }, pin2: { rgb_serial: pad_leds, number: 7 }, pin3: { rgb_serial: pad_leds, number: 8 } }
  - { id: pad_16_led, name: "Pad 16", pin: { rgb_serial: pad_leds, number: 9 }, pin2: { rgb_serial: pad_leds, number: 10 }, pin3: { rgb_serial: pad_leds, number: 11 } }

# Faders: 12-bit ADC. The stock map is (raw - 80) * 127 / 3920, so 80..4000 is
# used as the range. [likely] Which slot is which physical fader is [guess]:
# slot 0 is the one direct fader (PA6), slots 1-8 come from the mux.
analog:
  - { id: fader_1, pin: { cd74hc4051: fader_mux, number: 0 }, cc: 20, adc_min: 80, adc_max: 4000, daw: volume_1 }   # [guess] position
  - { id: fader_2, pin: { cd74hc4051: fader_mux, number: 1 }, cc: 21, adc_min: 80, adc_max: 4000, daw: volume_2 }   # [guess]
  - { id: fader_3, pin: { cd74hc4051: fader_mux, number: 2 }, cc: 22, adc_min: 80, adc_max: 4000, daw: volume_3 }   # [guess]
  - { id: fader_4, pin: { cd74hc4051: fader_mux, number: 3 }, cc: 23, adc_min: 80, adc_max: 4000, daw: volume_4 }   # [guess]
  - { id: fader_5, pin: { cd74hc4051: fader_mux, number: 4 }, cc: 24, adc_min: 80, adc_max: 4000, daw: volume_5 }   # [guess]
  - { id: fader_6, pin: { cd74hc4051: fader_mux, number: 5 }, cc: 25, adc_min: 80, adc_max: 4000, daw: volume_6 }   # [guess]
  - { id: fader_7, pin: { cd74hc4051: fader_mux, number: 6 }, cc: 26, adc_min: 80, adc_max: 4000, daw: volume_7 }   # [guess]
  - { id: fader_8, pin: { cd74hc4051: fader_mux, number: 7 }, cc: 27, adc_min: 80, adc_max: 4000, daw: volume_8 }   # [guess]
  - { id: fader_9, name: Master, pin: PA6, cc: 7, adc_min: 80, adc_max: 4000, daw: master_volume }   # [sure] PA6 = ch6, direct; [guess] that it is the master fader
  # Wheels on PA4 (ch4) and PA5 (ch5) [sure]; the panel has pitch then mod,
  # left to right [sure, 2026-11-03: PA4 = pitch, analog 9].
  # The pitch wheel's resting reading at power-up is its centre.
  # Measured 2026-11-03: raw 1404 bottom, 1929 at rest, 2375 top; the ends
  # sit a little inside so full bend is reached.
  - { id: pitch_wheel, name: Pitch, pin: PA4, mode: pitch_bend, adc_min: 1420, adc_max: 2360 }
  - { id: mod_wheel, name: Mod, pin: PA5, cc: 1, adc_min: 1420, adc_max: 2360 }   # about the same range as pitch
  # Aftertouch sensor on PC3 (ch13) [sure pin, likely use: hw-map.md]: channel
  # pressure. The stock app works in raw 0x4D0..0x900 (1232..2304). The
  # reading falls as you press [sure: tested], so adc_min is the high end.
  - { id: aftertouch, name: Aftertouch, pin: PC3, mode: channel_pressure, adc_min: 2304, adc_max: 1232 }
  # XY pad axes: CC 16 / 17 [guess: unassigned general-purpose CCs]; 0, 0 is
  # bottom left [sure, tested]. Its edges read about raw 800..3130 [sure, a
  # trace around the edge with 592..3408 gave 9..115]. Released, they hold
  # their last value.
  - { id: xy_x, name: XY X, pin: { xy_pad: xy, number: x }, cc: 16, adc_min: 830, adc_max: 3100 }
  - { id: xy_y, name: XY Y, pin: { xy_pad: xy, number: y }, cc: 17, adc_min: 830, adc_max: 3100 }

# ---- the matrix ----------------------------------------------------------

# Row select (hw-map.md §2, [sure]): PB3-PB5 = address, PB6/PB7 = group.
decoder:
  - id: rows
    address: [PB3, PB4, PB5]
    groups:
      - { PB6: 1, PB7: 0 }     # outputs 0-7: key rows 0-7
      - { PB6: 0, PB7: 1 }     # outputs 8-15: key rows 8-15
      - { PB6: 0, PB7: 0 }     # outputs 16-23: panel buttons 16-20, encoders 21-22

# Panel buttons: slot = (row - 16) * 8 + column, column c = PB(8+c). Slots
# 0-37 are mapped on hardware (2026-11-03; 20-28 = b1-b9 under the faders:
# b1 under the master fader, b2-b9 under faders 1-8; 29 = button mode).
# Slots 38 and 39 have no button (placeholders). A switch_matrix takes at
# most 32 switches, so row 20 is its own.
switch_matrix:
  - id: panel
    rows: { decoder: rows, first: 16, count: 4 }
    rows_per_scan: 2       # two rows per scan, in turn: each row every 1.6 ms (quick taps)
    columns:
      - { number: PB8, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB9, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB10, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB11, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB12, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB13, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB14, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB15, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    settle: 3us            # [guess]
  - id: panel_row20
    rows: { decoder: rows, first: 20, count: 1 }
    columns:
      - { number: PB8, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB9, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB10, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB11, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB12, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB13, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB14, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB15, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    settle: 3us            # [guess]
  # Encoders 1-4 on row 21, 5-8 on row 22: A = column 2n, B = column 2n+1 [sure, hw-map.md §2]
  - id: encoder_rows
    rows: { decoder: rows, first: 21, count: 2 }
    columns:
      - { number: PB8, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB9, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB10, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB11, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB12, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB13, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB14, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB15, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    settle: 3us            # [guess]

# 61 keys, two contacts each on rows 2k / 2k+1 (same column). Key map from the
# stock firmware's table (hw-map.md §9, [sure]): key 0 = the lowest C = note 36.
key_matrix:
  type: velocity
  contacts: rows
  rows: { decoder: rows, first: 0, count: 16 }
  columns:
    - { number: PB8, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB9, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB10, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB11, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB12, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB13, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB14, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB15, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
  keys: 61
  first_note: 36
  settle: 3us              # [guess] the stock scan waits ~30 loop passes per row
  key_map:
    - [55, 54, 53, 52, 51, 50, 49, 48]   # rows 0/1
    - [47, 46, 45, 44, 43, 42, 41, 40]   # rows 2/3
    - [39, 38, 37, 36, 35, 34, 33, 32]   # rows 4/5
    - [31, 30, 29, 28, 27, 26, 25, 24]   # rows 6/7
    - [23, 22, 21, 20, 19, 18, 17, 16]   # rows 8/9
    - [15, 14, 13, 12, 11, 10, 9, 8]   # rows 10/11
    - [7, 6, 5, 4, 3, 2, 1, 0]   # rows 12/13
    - [null, null, null, 60, 59, 58, 57, 56]   # rows 14/15

# Slots 0-19: labels from the user (2026-11-03). Up + down at power-on is the
# bootloader's update mode. CC numbers for the unlabelled-function buttons are
# placeholders to change in the web editor.
buttons:
  # Sustain jack: PC9, input with pull-up, read directly (0x080120FC). [likely]
  # The stock app learns the pedal polarity at power-up. "inverted: true"
  # assumes a normally-open pedal that shorts to ground. [guess]
  - id: sustain
    pin: { number: PC9, mode: INPUT_PULLUP, inverted: true }
    action: cc_momentary
    cc: 64
  # Up / Down step through the presets (the display shows the name); with
  # Channel held they change the MIDI channel instead (modes: below).
  # Panel slot 0 is the leftmost of the two, Down (the user, 2026-11-03).
  - { id: up, name: "Up", pin: { switch_matrix: panel, number: 1 }, action: preset_next }
  - { id: down, name: "Down", pin: { switch_matrix: panel, number: 0 }, action: preset_prev }
  - { id: shift, name: "Shift", pin: { switch_matrix: panel, number: 2 }, action: cc_momentary, cc: 102, daw: shift }
  - { id: channel, name: "Channel", pin: { switch_matrix: panel, number: 3 }, led: channel_led }   # holds the channel mode
  - { id: edit, name: "Edit", pin: { switch_matrix: panel, number: 4 }, action: cc_momentary, cc: 104, led: edit_led }
  - { id: zone, name: "Zone", pin: { switch_matrix: panel, number: 5 }, action: cc_momentary, cc: 105, led: zone_led }
  - { id: num_1, name: "1", pin: { switch_matrix: panel, number: 6 }, action: cc_momentary, cc: 106, led: num_1_led }
  - { id: num_2, name: "2", pin: { switch_matrix: panel, number: 7 }, action: cc_momentary, cc: 107, led: num_2_led }
  - { id: num_3, name: "3", pin: { switch_matrix: panel, number: 8 }, action: cc_momentary, cc: 108, led: num_3_led }
  - { id: num_4, name: "4", pin: { switch_matrix: panel, number: 9 }, action: cc_momentary, cc: 109, led: num_4_led }
  - { id: rewind, name: "Rewind", pin: { switch_matrix: panel, number: 10 }, action: cc_momentary, cc: 110, daw: rewind }
  - { id: fast_forward, name: "Fast forward", pin: { switch_matrix: panel, number: 11 }, action: cc_momentary, cc: 111, daw: fast_forward }
  - { id: stop, name: "Stop", pin: { switch_matrix: panel, number: 12 }, action: cc_momentary, cc: 112, daw: stop }
  - { id: play, name: "Play", pin: { switch_matrix: panel, number: 13 }, action: cc_momentary, cc: 113, daw: play }
  - { id: record, name: "Record", pin: { switch_matrix: panel, number: 14 }, action: cc_momentary, cc: 114, daw: record }
  - { id: pad_octave_down, name: "Pad octave -", pin: { switch_matrix: panel, number: 15 }, action: cc_momentary, cc: 115 }   # Shift + it: the pad grid (modes: pads)
  - { id: pad_octave_up, name: "Pad octave +", pin: { switch_matrix: panel, number: 16 }, action: cc_momentary, cc: 116 }
  - { id: transpose, name: "Transpose", pin: { switch_matrix: panel, number: 17 }, action: cc_momentary, cc: 117 }
  - { id: octave_down, name: "Octave -", pin: { switch_matrix: panel, number: 18 }, action: octave_down }
  - { id: octave_up, name: "Octave +", pin: { switch_matrix: panel, number: 19 }, action: octave_up }
  - { id: b1, name: "B1", pin: { switch_matrix: panel, number: 20 }, action: cc_toggle, cc: 85, led: b1_led, daw: master_mute }   # under the master fader
  - { id: b2, name: "B2", pin: { switch_matrix: panel, number: 21 }, action: cc_toggle, cc: 86, led: b2_led, daw: mute_1 }   # under fader 1
  - { id: b3, name: "B3", pin: { switch_matrix: panel, number: 22 }, action: cc_toggle, cc: 87, led: b3_led, daw: mute_2 }   # under fader 2
  - { id: b4, name: "B4", pin: { switch_matrix: panel, number: 23 }, action: cc_toggle, cc: 88, led: b4_led, daw: mute_3 }   # under fader 3
  - { id: b5, name: "B5", pin: { switch_matrix: panel, number: 24 }, action: cc_toggle, cc: 89, led: b5_led, daw: mute_4 }   # under fader 4
  - { id: b6, name: "B6", pin: { switch_matrix: panel, number: 25 }, action: cc_toggle, cc: 90, led: b6_led, daw: mute_5 }   # under fader 5
  - { id: b7, name: "B7", pin: { switch_matrix: panel, number: 26 }, action: cc_toggle, cc: 91, led: b7_led, daw: mute_6 }   # under fader 6
  - { id: b8, name: "B8", pin: { switch_matrix: panel, number: 27 }, action: cc_toggle, cc: 92, led: b8_led, daw: mute_7 }   # under fader 7
  - { id: b9, name: "B9", pin: { switch_matrix: panel, number: 28 }, action: cc_toggle, cc: 93, led: b9_led, daw: mute_8 }   # under fader 8
  - { id: button_mode, name: "Button mode", pin: { switch_matrix: panel, number: 29 }, action: cc_momentary, cc: 84 }   # Shift + it: the mute / arm layers (modes: below); its LED shows which
  - { id: bank_left, name: "Bank left", pin: { switch_matrix: panel, number: 30 }, action: cc_momentary, cc: 94, led: bank_left_led, daw: bank_prev }
  - { id: bank_right, name: "Bank right", pin: { switch_matrix: panel, number: 31 }, action: cc_momentary, cc: 95, led: bank_right_led, daw: bank_next }
  - { id: fader_mode, name: "Fader mode", pin: { switch_matrix: panel_row20, number: 0 }, action: cc_momentary, cc: 96, led: fader_mode_led }
  - { id: encoder_mode, name: "Encoder mode", pin: { switch_matrix: panel_row20, number: 1 }, action: cc_momentary, cc: 97 }   # Shift + it: the next encoder mode (modes: encoders); its LED shows which
  - { id: x_mode, name: "X mode", pin: { switch_matrix: panel_row20, number: 2 }, action: cc_momentary, cc: 98, led: x_mode_led }
  - { id: x_button, name: "X", pin: { switch_matrix: panel_row20, number: 3 }, action: cc_momentary, cc: 99 }
  - { id: y_mode, name: "Y mode", pin: { switch_matrix: panel_row20, number: 4 }, action: cc_momentary, cc: 100, led: y_mode_led }
  - { id: y_button, name: "Y", pin: { switch_matrix: panel_row20, number: 5 }, action: cc_momentary, cc: 101 }
  - { id: slot_38, name: "Slot 38", pin: { switch_matrix: panel_row20, number: 6 }, action: none }
  - { id: slot_39, name: "Slot 39", pin: { switch_matrix: panel_row20, number: 7 }, action: none }

# x1 decoding in the stock firmware: one step per A rising edge. [guess] 4 quadrature steps per detent.
encoders:
  - { id: encoder_1, name: "E1", pin_a: { switch_matrix: encoder_rows, number: 0 }, pin_b: { switch_matrix: encoder_rows, number: 1 }, cc: 70 }
  - { id: encoder_2, name: "E2", pin_a: { switch_matrix: encoder_rows, number: 2 }, pin_b: { switch_matrix: encoder_rows, number: 3 }, cc: 71 }
  - { id: encoder_3, name: "E3", pin_a: { switch_matrix: encoder_rows, number: 4 }, pin_b: { switch_matrix: encoder_rows, number: 5 }, cc: 72 }
  - { id: encoder_4, name: "E4", pin_a: { switch_matrix: encoder_rows, number: 6 }, pin_b: { switch_matrix: encoder_rows, number: 7 }, cc: 73 }
  - { id: encoder_5, name: "E5", pin_a: { switch_matrix: encoder_rows, number: 8 }, pin_b: { switch_matrix: encoder_rows, number: 9 }, cc: 74 }
  - { id: encoder_6, name: "E6", pin_a: { switch_matrix: encoder_rows, number: 10 }, pin_b: { switch_matrix: encoder_rows, number: 11 }, cc: 75 }
  - { id: encoder_7, name: "E7", pin_a: { switch_matrix: encoder_rows, number: 12 }, pin_b: { switch_matrix: encoder_rows, number: 13 }, cc: 76 }
  - { id: encoder_8, name: "E8", pin_a: { switch_matrix: encoder_rows, number: 14 }, pin_b: { switch_matrix: encoder_rows, number: 15 }, cc: 77 }

# Encoder acceleration (core/README.md "Encoder acceleration"), on all eight
# and their twins: detents at least 80 ms apart move 1 step each, quicker
# turns up to 8 steps per detent (medium: slow 80ms, fast 10ms, max 8,
# quadratic): 24 detents in half a second sweep 0..127. [guess] untried on
# the hardware: try low / high, or `acceleration: off` on one encoder.
encoder_settings:
  acceleration: medium

# Pads: a 4x4 grid labelled 1-16 from the bottom left, row by row, left to
# right. Pad k is pad_k. Mapped on hardware (2026-11-03): the mux slots count
# from the TOP row, left to right: slots 0-7 (pad_mux_a) are the top two rows,
# 8-15 (pad_mux_b) the bottom two. Polarity confirmed: pressure raises the
# reading (no inverted:).
pads:
  - { id: pad_1,  pin: { cd74hc4051: pad_mux_b, number: 4 }, note: 36, led: pad_1_led }
  - { id: pad_2,  pin: { cd74hc4051: pad_mux_b, number: 5 }, note: 37, led: pad_2_led }
  - { id: pad_3,  pin: { cd74hc4051: pad_mux_b, number: 6 }, note: 38, led: pad_3_led }
  - { id: pad_4,  pin: { cd74hc4051: pad_mux_b, number: 7 }, note: 39, led: pad_4_led }
  - { id: pad_5,  pin: { cd74hc4051: pad_mux_b, number: 0 }, note: 40, led: pad_5_led }
  - { id: pad_6,  pin: { cd74hc4051: pad_mux_b, number: 1 }, note: 41, led: pad_6_led }
  - { id: pad_7,  pin: { cd74hc4051: pad_mux_b, number: 2 }, note: 42, led: pad_7_led }
  - { id: pad_8,  pin: { cd74hc4051: pad_mux_b, number: 3 }, note: 43, led: pad_8_led }
  - { id: pad_9,  pin: { cd74hc4051: pad_mux_a, number: 4 }, note: 44, led: pad_9_led }
  - { id: pad_10, pin: { cd74hc4051: pad_mux_a, number: 5 }, note: 45, led: pad_10_led }
  - { id: pad_11, pin: { cd74hc4051: pad_mux_a, number: 6 }, note: 46, led: pad_11_led }
  - { id: pad_12, pin: { cd74hc4051: pad_mux_a, number: 7 }, note: 47, led: pad_12_led }
  - { id: pad_13, pin: { cd74hc4051: pad_mux_a, number: 0 }, note: 48, led: pad_13_led }
  - { id: pad_14, pin: { cd74hc4051: pad_mux_a, number: 1 }, note: 49, led: pad_14_led }
  - { id: pad_15, pin: { cd74hc4051: pad_mux_a, number: 2 }, note: 50, led: pad_15_led }
  - { id: pad_16, pin: { cd74hc4051: pad_mux_a, number: 3 }, note: 51, led: pad_16_led }

# Pad sensing. All [guess] until tried: tune them live from the web app
# (Pads group); with debug.events on and the pad grid on (Shift + Pad
# octave -), each hit's EVENT pad value is its peak reading x 4.
pad_settings:
  channel: 10              # [guess] drums on channel 10; 0 = follow midi.channel
  threshold: 200           # [guess] reading that starts a hit
  release: 100             # [guess] the pad is let go below this
  full: 3000               # [guess] peak reading for velocity 127
  window: 3ms              # peak search after the threshold (3-4 samples at 1 ms)
  retrigger: 20ms          # no new hit for 20 ms after a release

# Presets (core/README.md "Presets"): Up / Down step through them, and the
# display shows the name. The settings store (3 pages of 1 KB) holds 4 slots
# at most. The layer twins' settings are global (layer.*, 0.2.82), stored
# once, so a preset is smaller: 4 slots are 1460 of 1744 B at worst case
# (84%, under the builder's 85% warning). Slots 2-4 start free: make,
# rename, reorder and delete presets on the web page's Presets tab, or with
# `gemifi.py preset save/rename/move/delete`.
presets:
  slots: 4
  list:
    - name: Default

# While Channel is held, Up / Down change the MIDI channel (the display
# shows "CH <n>"; 16 wraps to 1) and the keys keep playing; Channel's LED is
# lit meanwhile (core/README.md "Modes", hold:).
modes:
  - id: channel
    hold: { button: channel }
    buttons:
      up: channel_up
      down: channel_down
  # B1-B9 start as mute buttons (B1 the master, B2-B9 strips 1-8): white,
  # blue while muted, and Button mode's LED is blue. Shift + Button mode
  # switches B2-B9 to record arm (their twins, core/README.md "Button
  # layers"): CC 52-59, red while armed, and Button mode's LED red; again
  # goes back. Each layer keeps its own on/off states. B1 stays master mute.
  # Button mode alone still sends CC 84.
  - id: arm
    toggle: { button: button_mode, with: shift }
    led: button_mode_led
    layer:
      b2: { cc: 52, daw: arm_1, active: red }
      b3: { cc: 53, daw: arm_2, active: red }
      b4: { cc: 54, daw: arm_3, active: red }
      b5: { cc: 55, daw: arm_4, active: red }
      b6: { cc: 56, daw: arm_5, active: red }
      b7: { cc: 57, daw: arm_6, active: red }
      b8: { cc: 58, daw: arm_7, active: red }
      b9: { cc: 59, daw: arm_8, active: red }
  # Trigger pad mode: Shift + Pad octave - turns the pads into a DAW
  # script's clip grid (core/README.md "Button layers"): each pad is its
  # twin, clip_T_S (T = column 1-4 left to right, S = row 1-4 from the top),
  # which plays no note but sends an EVENT the script launches the clip
  # with, and its LED is off unless the script lights it. Pad octave - / +
  # scroll the grid left / right (their CCs stay). Again goes back.
  - id: pads
    toggle: { button: pad_octave_down, with: shift }
    layer:
      pad_1: { daw: clip_1_4, idle: off }
      pad_2: { daw: clip_2_4, idle: off }
      pad_3: { daw: clip_3_4, idle: off }
      pad_4: { daw: clip_4_4, idle: off }
      pad_5: { daw: clip_1_3, idle: off }
      pad_6: { daw: clip_2_3, idle: off }
      pad_7: { daw: clip_3_3, idle: off }
      pad_8: { daw: clip_4_3, idle: off }
      pad_9: { daw: clip_1_2, idle: off }
      pad_10: { daw: clip_2_2, idle: off }
      pad_11: { daw: clip_3_2, idle: off }
      pad_12: { daw: clip_4_2, idle: off }
      pad_13: { daw: clip_1_1, idle: off }
      pad_14: { daw: clip_2_1, idle: off }
      pad_15: { daw: clip_3_1, idle: off }
      pad_16: { daw: clip_4_1, idle: off }
      pad_octave_down: { daw: grid_left }
      pad_octave_up: { daw: grid_right }
  # Shift + Encoder mode cycles E1-E8 through the encoder modes below
  # (core/README.md "Cycles"), skipping the disabled ones (layer.enabled in
  # the config; PAN starts disabled). The display shows the mode's name and
  # Encoder mode's LED its colour. Power-on starts in the first enabled one.
  # Encoder mode alone still sends CC 97. Independent of arm and pads.
  #   MIDI   (blue):  plain CC 70-77, Bank left / right as they are
  #   ZYN    (cyan):  E1-E4 Zynthian's 4 knobs, E5-E8 device_param_1-4,
  #                   Bank left / right page E5-E8 (device_bank_prev / next)
  #   DEVICE (green): E1-E8 device_param_1-8, Bank left / right page all 8
  #   PAN    (red):   E1-E8 pan_1-8
  # In ZYN, DEVICE and PAN the encoders send no CC (cc: none), only EVENTs
  # for a DAW script; Bank left / right keep their CCs.
  - id: encoders
    cycle: { button: encoder_mode, with: shift }
    led: encoder_mode_led
    steps:
      - { id: enc_midi, name: MIDI, colour: blue }
      - id: enc_zyn
        name: ZYN
        colour: cyan
        layer:
          encoder_1: { cc: none, daw: zynthian.zynpot_1 }
          encoder_2: { cc: none, daw: zynthian.zynpot_2 }
          encoder_3: { cc: none, daw: zynthian.zynpot_3 }
          encoder_4: { cc: none, daw: zynthian.zynpot_4 }
          encoder_5: { cc: none, daw: device_param_1 }
          encoder_6: { cc: none, daw: device_param_2 }
          encoder_7: { cc: none, daw: device_param_3 }
          encoder_8: { cc: none, daw: device_param_4 }
          bank_left: { daw: device_bank_prev }
          bank_right: { daw: device_bank_next }
      - id: enc_device
        name: DEVICE
        colour: green
        layer:
          encoder_1: { cc: none, daw: device_param_1 }
          encoder_2: { cc: none, daw: device_param_2 }
          encoder_3: { cc: none, daw: device_param_3 }
          encoder_4: { cc: none, daw: device_param_4 }
          encoder_5: { cc: none, daw: device_param_5 }
          encoder_6: { cc: none, daw: device_param_6 }
          encoder_7: { cc: none, daw: device_param_7 }
          encoder_8: { cc: none, daw: device_param_8 }
          bank_left: { daw: device_bank_prev }
          bank_right: { daw: device_bank_next }
      - id: enc_pan
        name: PAN
        colour: red
        enabled: false
        layer:
          encoder_1: { cc: none, daw: pan_1 }
          encoder_2: { cc: none, daw: pan_2 }
          encoder_3: { cc: none, daw: pan_3 }
          encoder_4: { cc: none, daw: pan_4 }
          encoder_5: { cc: none, daw: pan_5 }
          encoder_6: { cc: none, daw: pan_6 }
          encoder_7: { cc: none, daw: pan_7 }
          encoder_8: { cc: none, daw: pan_8 }

# Where the controls are, for the web page's drawing (core/README.md "Layout"): units of about
# 5 mm from the top left; [x, y] or [x, y, w, h]. Approximate, from the panel as the user
# described it: the XY pad top left with the wheels under it, left of the keys; the display,
# preset and transport buttons; the 16 pads (pad 1 bottom left, pad 13 top left); the encoders
# over the faders, B1 under the master fader and B2-B9 under faders 1-8. Sustain is a jack and
# aftertouch is under the keys, so they aren't drawn; nor are slots 38 and 39.
layout:
  keys: [18, 30, 144, 22]
  controls:
    xy_x:         { x: 2, y: 2, w: 12, h: 12, shape: xy }
    x_mode:       [15, 2]
    x_button:     [15, 5]
    y_mode:       [15, 9]
    y_button:     [15, 12]
    pitch_wheel:  { x: 3, y: 30, w: 4, h: 14, shape: wheel }
    mod_wheel:    { x: 10, y: 30, w: 4, h: 14, shape: wheel }
    display:      [22, 2, 16, 5]
    down:         [40, 3]
    up:           [44, 3]
    channel:      [22, 9]
    edit:         [26, 9]
    zone:         [30, 9]
    num_1:        [34, 9]
    num_2:        [38, 9]
    num_3:        [42, 9]
    num_4:        [46, 9]
    shift:        [22, 13]
    transpose:    [26, 13]
    octave_down:  [30, 13]
    octave_up:    [34, 13]
    pad_octave_down: [40, 13]
    pad_octave_up:   [44, 13]
    rewind:       [22, 18, 4, 3]
    fast_forward: [27, 18, 4, 3]
    stop:         [32, 18, 4, 3]

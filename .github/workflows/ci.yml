# The tests. Release (release.yml) runs after this passes on main, so a red run never
# becomes a version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-c:
    name: Builder, core, host tools, host-sim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # gcc-arm-none-eabi: host-sim links a real NUC firmware image (hello-led.gfw). Without its
      # recommended newlib, as in the Dockerfile: the NUC firmware is -nostdlib.
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi make
          pip install pyyaml==6.0.3 pytest

      - name: Builder
        working-directory: tools/builder
        run: python -m pytest -q tests

      - name: Core
        run: make -C core/test test

      - name: Host tools
        working-directory: tools/host
        run: python -m unittest discover -s tests -t .

      # The protocol test vectors are generated from the host codec: a codec change without a
      # regenerated protocol/test-vectors.json fails here.
      - name: Test vectors up to date
        working-directory: tools/host
        run: python make_test_vectors.py --check

      - name: Ableton Live script
        working-directory: hosts/ableton-live
        run: python -m pytest -q

      - name: STM32F1 config store (simulated flash)
        run: make -C platform/stm32f1/test/cs-test test

      - name: NUC host-sim (bootloader, app, end to end)
        run: make -C platform/nuvoton-nuc1xx/test/host-sim test

  bitwig:
    name: Bitwig extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosts/bitwig
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: hosts/bitwig/pom.xml

      # Its protocol tests read protocol/test-vectors.json, so a protocol change that breaks the
      # extension fails here.
      - run: mvn -B -ntp package

  web:
    name: Web updater
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/updater
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/updater/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build

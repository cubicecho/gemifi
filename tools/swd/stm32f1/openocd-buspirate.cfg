# Bus Pirate v3.6 (fw 5.10) -> M-Audio Code 61 (STM32F103RBT6) over SWD.
# Use:  openocd -s tools/swd/stm32f1 -f openocd-buspirate.cfg -f lib.tcl ...   (code61.sh does this)
# Wiring (header JMP1 on the main board, pin 1 = square pad; found 2026-11-03):
#   JMP1-1 GND             <- BP GND
#   JMP1-2 SWDIO (pin 46)  <- BP MOSI
#   JMP1-3 SWCLK (pin 49)  <- BP CLK
#   JMP1-4 3.3 V (pin 48)  <- nothing, unless BP_VREG is set (see code61.sh --bp-power)
# There is no NRST on JMP1: resets go through SYSRESETREQ (reset_config none).
# Power order as on the Keystation: Bus Pirate first, keyboard last; unplug the keyboard first.
# The FTDI latency timer must be 1 ms (udev rule; see tools/README.md).
# Override the port with:  -c "set BP_PORT /dev/ttyUSB1"  before -f.
if {![info exists BP_PORT]} { set BP_PORT /dev/ttyUSB0 }
if {![info exists BP_VREG]} { set BP_VREG 0 }
adapter driver buspirate
buspirate port $BP_PORT
buspirate speed normal
buspirate mode open-drain
buspirate pullup 0
buspirate vreg $BP_VREG
transport select swd
adapter speed 100

set CHIPNAME stm32f1x
set WORKAREASIZE 0x1000
source [find target/stm32f1x.cfg]
reset_config none separate

# Freeze the IWDG (and IWDG/WWDG/timers) while the core is halted (DBGMCU_CR). Without it the app's 1 s
# watchdog resets the chip in the middle of a flash write, the reset releases the power latch (PC15) and
# the board switches off.
$_TARGETNAME configure -event halted { catch { mmw 0xE0042004 0x00000307 0 } }
$_TARGETNAME configure -event examine-end { catch { mmw 0xE0042004 0x00000307 0 } }

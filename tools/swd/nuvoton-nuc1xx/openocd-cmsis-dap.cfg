# Raspberry Pi Pico running debugprobe (CMSIS-DAP) -> Keystation Mini 32 MK3 (NUC120LC1BN) over SWD.
# Use:  openocd -s tools/swd/nuvoton-nuc1xx -f openocd-cmsis-dap.cfg ...   (the scripts here do this)
# Wiring (debugprobe defaults): GP2 = SWCLK -> TP2 (ICE_CK), GP3 = SWDIO -> TP1 (ICE_DAT), GND -> TP4.
# Do NOT connect VSYS/3V3/VBUS to the keyboard. The Pico drives 3.3 V like the Bus Pirate did.
# A 1 kOhm series resistor on each signal limits back-powering. Same power order as the Bus Pirate:
# probe first, keyboard last; unplug the keyboard first.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000

source [find nuc1xx-target.cfg]

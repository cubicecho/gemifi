# Pad sensing. All [guess] until tried: tune them live from the web app
# (Pads group); with debug.events on, each hit's EVENT pad value is its peak
# reading x 4.
pad_settings:
  channel: 10              # [guess] drums on channel 10; 0 = follow midi.channel
  threshold: 200           # [guess] reading that starts a hit
  release: 100             # [guess] the pad is let go below this
  full: 3000               # [guess] peak reading for velocity 127
  window: 3ms              # peak search after the threshold (3-4 samples at 1 ms)
  retrigger: 20ms          # no new hit for 20 ms after a release

# M-Audio Code 61 with gemifi (STM32F103RBT6), run by the gemifi bootloader
# (bootloader/stm32f1).
#
# Works on hardware: keys with velocity, panel buttons, encoders, faders,
# wheels, aftertouch, the XY pad, pads and their LEDs, the button LEDs, the
# display (preset names, "CH <n>"), the rear MIDI jacks, presets on Up / Down
# (Channel held: the MIDI channel), the soft power button (hold 2 s to switch
# off) and settings saving. Values tagged [guess] are untuned.
#
# DAW scripts (Bitwig, Live; hosts/README.md) find the transport, faders,
# encoders and B1-B9 by their daw: roles; without a script they send their
# CCs as usual. The display shows what a script sends it (daw: param).
#
# Layers (modes: below), independent of each other, untested on hardware:
#   Shift + Button mode   B2-B9 switch between mute and record arm
#   Shift + Pad octave -  the pads become a clip grid for a DAW script
#   Shift + Encoder mode  the encoders step through MIDI / ZYN / DEVICE / PAN
#
# Confidence tags:
#   [sure]   confirmed on hardware
#   [likely] the pin is clear, what it is for is inferred
#   [guess]  needs a board photo or a hardware test
#
# The matrix: rows come from 3-to-8 decoders on PB3-PB5 (address) and PB6/PB7
# (group: PB6=1 rows 0-7, PB7=1 rows 8-15, both 0 rows 16-23); columns are
# PB8-PB15, pull-up, active-low. Keys on rows 0-15 (two contacts on rows
# 2k / 2k+1), panel buttons on rows 16-20, encoders on 21-22.
#
# Left out, because the core can't describe them yet:
#   - PB0 (ADC ch8): probably the rear "volume" (expression pedal) jack.
#   - USB D+ pull-up switch on PA8 (high = connected): driven by the platform.
# No boot_combo: Up + Down at power-on is the bootloader's update mode
# (bootloader/stm32f1), checked before the app runs.
gemifi: 2
name: m-audio-code61
friendly_name: Code 61
description: "M-Audio Code 61 (STM32F103): keys, panel, encoders, faders, wheels, aftertouch, XY pad, pads, LEDs, display, MIDI jacks and presets"
project:
  version: 0.2.85
board_id: 0x0002
platform: stm32f1
chip: STM32F103RB          # [sure] STM32F103RBT6 (chip marking, SWD IDCODE 0x20036410)
usb: { vid: 0x1209, pid: 0x0002 }
# write_to_flash: (core/README.md "Writes the device makes on its own"): what
# the device saves without a host asking. Left out = off: a preset picked on
# the device isn't remembered, and power-up is preset 1. A flash page erase
# stalls the scan for 20-40 ms, so the write waits until nothing is played.
# Saves from the web page or gemifi.py always work.
# write_to_flash:
#   last_preset: true   # power up on the preset used last
#   delay: 10s          # after the last switch (default)
#   idle: 3s            # and once nothing has been played for this long (default)
# The software scan tick. hardware_scan: below does the matrix and the
# analog inputs, so this mostly matters for a part moved back to the
# software scan.
scan_interval: 400us
# hardware_scan: (core/README.md "Hardware scan"): timers + DMA do the
# scanning, the CPU only looks at the results.
# matrix: keys, panel buttons and encoders (23 decoder rows on the PB8-PB15
# columns), by TIM1 + DMA: no CPU per row, and a key's two contacts are
# timed to the frame (23 rows, padded to 24, x row_time = 84 us), not the
# scan tick. precharge drives the columns high between rows, so the read
# only waits for a closed contact to pull a column down. Keys were fine at
# 1 us (row_time 1.5us, 36 us frames), but a lightly pressed panel button
# (carbon contact, a few kOhm) can take longer than that, which reads as a
# release mid-press (double presses): 3 us gives it room.
# Remove a part to go back to the software scan for it.
# analog: faders and pads, by TIM4 + ADC1 + DMA: TIM4 steps the three muxes'
# shared select lines (PC0-PC2) and, after their 4 us delay, starts ADC1 on
# PA7, PA6, PA1 and PA0; a sweep of all 8 steps takes 200 us. Pads see
# their strongest reading since the last pass, faders are read every 1 ms,
# and the main loop does no ADC work.
hardware_scan:
  matrix:
    row_time: 3.5us
    settle: 3us
    precharge: true
  analog: true

# Analog mux for the faders: 8:1, select lines PC0-PC2, common on PA7
# (ADC ch7) [sure], no enable line. The pads use the same select lines on two
# more muxes (PA0, PA1, below), so every use has allow_other_uses.
cd74hc4051:
  - id: fader_mux
    pin_s0: { number: PC0, allow_other_uses: true }   # [sure]
    pin_s1: { number: PC1, allow_other_uses: true }   # [sure]
    pin_s2: { number: PC2, allow_other_uses: true }   # [sure]
    common_pin: PA7        # [sure] ADC ch7
    delay: 4us             # [guess] settling time after a mux step
  # Pad muxes: mux step n = pad slot n on PA0 (ADC ch0), slot n + 8 on PA1 (ch1) [sure].
  # Keep delay: the same on muxes that share select lines.
  - id: pad_mux_a
    pin_s0: { number: PC0, allow_other_uses: true }   # [sure]
    pin_s1: { number: PC1, allow_other_uses: true }   # [sure]
    pin_s2: { number: PC2, allow_other_uses: true }   # [sure]
    common_pin: PA0        # [sure] ADC ch0
    delay: 4us             # [guess]
  - id: pad_mux_b
    pin_s0: { number: PC0, allow_other_uses: true }   # [sure]
    pin_s1: { number: PC1, allow_other_uses: true }   # [sure]
    pin_s2: { number: PC2, allow_other_uses: true }   # [sure]
    common_pin: PA1        # [sure] ADC ch1
    delay: 4us             # [guess]

# LED drivers: two TM1628-class chips, bit-banged, sharing CLK and DIO, each
# with its own STB [sure]. Together they drive every LED and the 6-character
# display. A pin on them is a RAM bit: number = byte * 8 + bit. PA15 is a
# JTAG pin at reset; the board config turns JTAG off (BOARD_SWJ_NOJTAG, SWD
# stays on). grids: and intensity: are left at their defaults [guess].
tm1628:
  - id: leds_a             # 14 RAM bytes, the TM1628 size [sure]
    clk_pin: { number: PC10, allow_other_uses: true }
    dio_pin: { number: PC11, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: PA15
    ram_bytes: 14
  - id: leds_b             # 6 RAM bytes: the 48 bits of the RGB button LEDs [sure]
    clk_pin: { number: PC10, allow_other_uses: true }
    dio_pin: { number: PC11, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: PC12
    ram_bytes: 6
# Pad LEDs: not on the TM1628s but on the pad board, a small controller fed by
# USART2 TX on PA2 at 115200 baud [sure]: one message per LED, 02, 0x80 + LED,
# R, G, B, 03, and an A5 keepalive (core/README.md "RGB serial LEDs"). Its
# LED index counts from the top row, like the pad mux slots: pad k
# (1 = bottom left) is LED (3 - (k-1) / 4) * 4 + (k-1) % 4.
rgb_serial:
  - id: pad_leds
    tx_pin: PA2
    count: 16

# The rear 5-pin MIDI jacks: USART1 at 31250 baud, TX PA9, RX PA10 [sure].
# MIDI In reaches the computer and the computer can play MIDI Out, on the
# main USB port (usb_merge; midi.usb_to_din), with an optional thru
# (midi.thru, off at first). mode: separate_port would give the jacks a USB
# port of their own ("Code 61 MIDI"), but two ports hang Chrome's Web MIDI
# on Windows for now.
din_midi:
  tx_pin: PA9
  rx_pin: PA10
  mode: usb_merge
  usb_to_din: true   # the computer's notes/CCs on the main port also play MIDI Out

# The XY pad, a 4-wire resistive panel [sure]: X (left to right) is PC4 high
# and PB2 low, read on PC5 (ADC ch15); Y (bottom to top) is PB1 high and PC5
# low, read on PC4 (ch14). The touch window is the default (touch_min /
# touch_max, core/README.md "XY pads").
xy_pad:
  - id: xy
    x_plus_pin: PC4
    x_minus_pin: PB2
    y_plus_pin: PB1
    y_minus_pin: PC5

# The 6-character 14-segment display, on chip A (leds_a) [sure, mapped on
# hardware]: each character is 16 RAM bits (2 bytes): bits 0-13 are
# segments a b c d e f g1 g2 h i j k l m (core/include/gm_display.h), bit 14
# its dot, bit 15 unused. Left to right the characters start at bits 48, 64,
# 80, 0, 16, 32 (bytes 6, 8, 10, 0, 2, 4).
displays:
  - id: display
    type: segment14
    daw: param             # a DAW script's text: the control being moved, the chain name
    chars:
      - { tm1628: leds_a, number: 48 }
      - { tm1628: leds_a, number: 64 }
      - { tm1628: leds_a, number: 80 }
      - { tm1628: leds_a, number: 0 }
      - { tm1628: leds_a, number: 16 }
      - { tm1628: leds_a, number: 32 }

# LEDs, mapped on hardware with the LED-map build
# (devices/m-audio-code61-ledmap.yaml). Chip A bits 0-95 are the display,
# bits 96-102 single-colour button LEDs. Chip B bit n (0-15) is an RGB LED's
# blue, n+16 its green, n+32 its red. Shift has no LED [sure]: no LED-driver
# bit, pad board LED 16-31 or unused GPIO (PC6-8, PC14, PD2) lights one.
# Looks (core/README.md "LED looks"): every LED is lit while idle so the
# panel is easy to see, and changes while active. RGB LEDs (buttons, pads)
# idle blue and go white; the single-colour ones (Channel, Edit, Zone, 1-4)
# are lit and go dark. Change them here, or per LED with idle: / active:.
led_defaults: { idle: blue, active: white }
leds:
  - { id: channel_led, name: "Channel", pin: { tm1628: leds_a, number: 96 } }
  - { id: edit_led, name: "Edit", pin: { tm1628: leds_a, number: 97 } }
  - { id: zone_led, name: "Zone", pin: { tm1628: leds_a, number: 98 } }
  - { id: num_1_led, name: "1", pin: { tm1628: leds_a, number: 99 } }
  - { id: num_2_led, name: "2", pin: { tm1628: leds_a, number: 100 } }
  - { id: num_3_led, name: "3", pin: { tm1628: leds_a, number: 101 } }
  - { id: num_4_led, name: "4", pin: { tm1628: leds_a, number: 102 } }
  - { id: b1_led, name: "B1", pin: { tm1628: leds_b, number: 32 }, pin2: { tm1628: leds_b, number: 16 }, pin3: { tm1628: leds_b, number: 0 }, idle: white, active: blue }
  - { id: b2_led, name: "B2", pin: { tm1628: leds_b, number: 33 }, pin2: { tm1628: leds_b, number: 17 }, pin3: { tm1628: leds_b, number: 1 }, idle: white, active: blue }
  - { id: b3_led, name: "B3", pin: { tm1628: leds_b, number: 34 }, pin2: { tm1628: leds_b, number: 18 }, pin3: { tm1628: leds_b, number: 2 }, idle: white, active: blue }
  - { id: b4_led, name: "B4", pin: { tm1628: leds_b, number: 35 }, pin2: { tm1628: leds_b, number: 19 }, pin3: { tm1628: leds_b, number: 3 }, idle: white, active: blue }
  - { id: b5_led, name: "B5", pin: { tm1628: leds_b, number: 36 }, pin2: { tm1628: leds_b, number: 20 }, pin3: { tm1628: leds_b, number: 4 }, idle: white, active: blue }
  - { id: b6_led, name: "B6", pin: { tm1628: leds_b, number: 37 }, pin2: { tm1628: leds_b, number: 21 }, pin3: { tm1628: leds_b, number: 5 }, idle: white, active: blue }
  - { id: b7_led, name: "B7", pin: { tm1628: leds_b, number: 38 }, pin2: { tm1628: leds_b, number: 22 }, pin3: { tm1628: leds_b, number: 6 }, idle: white, active: blue }

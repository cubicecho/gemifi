# Nuvoton NUC1xx (NUC120LC1BN) target + flash banks, shared by every probe config here.
# Same as OpenOCD's target/numicro.cfg, but with the AP fixed at 0 (-ap-num 0). The default AP
# scan takes too long on the Bus Pirate, and the Bus Pirate stopped responding partway through it.
# Load with `-s <this dir>` on the command line so `find` can locate it (the scripts here do that).
source [find target/swj-dp.tcl]
set _CHIPNAME NuMicro
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x0BB11477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x800 -work-area-backup 0
# Bank order: 0 APROM, 1 data flash, 2 LDROM, 3 CONFIG.
flash bank $_CHIPNAME.flash_aprom  numicro 0x00000000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.flash_data   numicro 0x0001F000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.flash_ldrom  numicro 0x00100000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.flash_config numicro 0x00300000 0 0 0 $_TARGETNAME
reset_config none
cortex_m reset_config sysresetreq

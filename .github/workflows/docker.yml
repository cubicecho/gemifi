# Build the gemifi image (dashboard + builder + web updater) and publish it to GHCR.
#
#   push to main      -> :edge, :sha-<short>
#   push tag v1.2.3   -> :1.2.3, :1.2, :latest, :sha-<short>
#   pull request      -> build only (amd64), nothing is pushed
#   manual run        -> :<branch>, :sha-<short> (publish a branch before it is merged)
#
# The first push creates the package as private. Make it public in the package settings,
# or `docker login ghcr.io` with a PAT that has read:packages. tools/builder/README.md "Docker".
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
        default: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cubicecho/gemifi

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under QEMU (slower). PRs build amd64 only, to stay quick.
      - name: Pick platforms
        id: plat
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.platforms }}
        run: |
          case "$EVENT" in
            pull_request)      p=linux/amd64 ;;
            workflow_dispatch) p=$INPUT ;;
            *)                 p=linux/amd64,linux/arm64 ;;
          esac
          echo "platforms=$p" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        if: contains(steps.plat.outputs.platforms, 'arm64')
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # GHCR shows the description from the index of a multi-arch image.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.title=gemifi
            org.opencontainers.image.description=gemifi builder: define a MIDI controller in YAML, build its firmware, flash it from the browser over Web MIDI
          annotations: |
            org.opencontainers.image.description=gemifi builder: define a MIDI controller in YAML, build its firmware, flash it from the browser over Web MIDI

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.plat.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

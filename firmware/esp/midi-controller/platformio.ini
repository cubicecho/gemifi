; gemifi midi-controller: the generic controller (core/) for ESP32 / S2 / S3 / ESP8266.
; Build: [GM_DEVICE=<device.yaml>] pio run -d firmware/esp/midi-controller -e <env> (README.md)
; SPDX-License-Identifier: MIT

[platformio]
; Optional overrides, e.g. another board: GM_PIO_EXTRA=<ini with
; [env:esp32s3] board = ...> (README.md "Build interface")
extra_configs = ${sysenv.GM_PIO_EXTRA}

[env]
framework = arduino
extra_scripts = pre:../gemifi_esp.py
lib_deps = symlink://../../../platform/esp
custom_gm_core = all
build_flags = -Wall -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board_build.partitions = min_spiffs.csv
; the core's USB library needs FS (USBMSCFS.h), which chain mode misses
lib_ldf_mode = deep

; classic ESP32: serial MIDI on the USB-UART (or BLE)
[env:esp32]
extends = esp32_base
board = esp32dev

; S2 / S3: native USB MIDI (TinyUSB, so USB mode 0)
[env:esp32s2]
extends = esp32_base
board = esp32-s2-saola-1

[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
build_unflags = -DARDUINO_USB_MODE=1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=0

[env:esp8266]
platform = espressif8266
board = d1_mini

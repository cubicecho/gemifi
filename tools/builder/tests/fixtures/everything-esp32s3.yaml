# Test fixture: every hub type and component kind on an ESP32-S3.
gemifi: 2
name: everything-s3
friendly_name: "Everything \"S3\" ?? test"
description: builder test fixture (all hub types)
board_id: 0x3FFE
platform: esp32s3
chip: esp32-s3-devkitc-1
midi: { transport: usb }
usb: { vid: 0x1209, pid: 0x0002 }
i2c: { sda: GPIO8, scl: GPIO9 }
scan_interval: 250us
boot_combo: [shift_a, pcf_0]

# hubs are numbered in file order: leds595 1, rows595 2, buttons165 3, cols165 4,
# faders 5, knobs 6, mcp 7, pcf 8, tm_a 9, tm_b 10
sn74hc595:
  - id: leds595                # LED chain
    data_pin: GPIO10
    clock_pin: GPIO11
    latch_pin: GPIO12
    oe_pin: GPIO13
    sr_count: 2
  - id: rows595                # matrix rows; shares clock/latch with cols165
    data_pin: GPIO17
    clock_pin: { number: GPIO18, allow_other_uses: true }
    latch_pin: { number: GPIO21, allow_other_uses: true }

sn74hc165:
  - id: buttons165
    data_pin: GPIO14
    clock_pin: GPIO15
    load_pin: GPIO16
  - id: cols165                # matrix columns
    data_pin: GPIO38
    clock_pin: { number: GPIO18, allow_other_uses: true }
    load_pin: { number: GPIO21, allow_other_uses: true }

cd74hc4051:
  - id: faders
    pin_s0: GPIO4
    pin_s1: GPIO5
    pin_s2: GPIO6
    common_pin: GPIO1
    delay: 5us

cd74hc4067:
  - id: knobs
    pin_s0: GPIO39
    pin_s1: GPIO40
    pin_s2: GPIO41
    pin_s3: GPIO42
    common_pin: GPIO2
    enable_pin: GPIO47

mcp23017:
  - id: mcp
    address: 0x21

pcf8574:
  - id: pcf
    address: 0x38

tm1628:                        # two LED drivers sharing CLK and DIO
  - id: tm_a
    clk_pin: { number: GPIO35, allow_other_uses: true }
    dio_pin: { number: GPIO36, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: GPIO37
    intensity: 2
    grids: 6
  - id: tm_b
    clk_pin: { number: GPIO35, allow_other_uses: true }
    dio_pin: { number: GPIO36, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: GPIO0
    ram_bytes: 6

buttons:
  - { id: shift_a, pin: { sn74hc165: buttons165, number: 0, inverted: true }, action: cc_momentary, cc: 64, led: l0 }
  - { id: shift_b, pin: { sn74hc165: buttons165, number: 7, inverted: true }, action: note, note: 60, led: bi }
  - { name: PCF 0, pin: { pcf8574: pcf, number: P0, inverted: true }, action: program_next }
  - { name: PCF 1, pin: { pcf8574: pcf, number: 1, inverted: true }, action: program_prev }
  - { id: mux_btn, name: Mux btn, pin: { cd74hc4067: knobs, number: 15, inverted: true }, action: transpose_up }
  - { id: mcu_btn, pin: { number: GPIO48, mode: INPUT_PULLUP, inverted: true }, action: bend_up }

leds:
  - { id: l0, pin: { sn74hc595: leds595, number: 0 } }
  - { id: bi, pin: { sn74hc595: leds595, number: 15 }, pin2: { mcp23xxx: mcp, number: GPB7 }, idle: colour2 }
  - { id: pcf_led, pin: { pcf8574: pcf, number: 7, inverted: true } }
  - { id: tm_led, pin: { tm1628: tm_a, number: 37 }, idle: on }
  - { id: tm_led_b, pin: { tm1628: tm_b, number: 47, inverted: true } }
  - id: tm_rgb                 # RGB LED on three RAM bits: red, green, blue
    pin: { tm1628: tm_a, number: 0 }
    pin2: { tm1628: tm_a, number: 1 }
    pin3: { tm1628: tm_a, number: 8 }

analog:
  - { id: fader_1, pin: { cd74hc4051: faders, number: 0 }, cc: 20 }
  - { id: fader_8, pin: { cd74hc4051: faders, number: 7 }, cc: 27, adc_min: 4095, adc_max: 0 }
  - { id: knob_1,  pin: { cd74hc4067: knobs, number: 0 }, cc: 70 }
  - { id: direct,  pin: GPIO3, cc: 7 }

encoders:
  - id: enc_mcp
    name: Enc MCP
    pin_a: { mcp23xxx: mcp, number: 0, mode: INPUT_PULLUP }
    pin_b: { mcp23xxx: mcp, number: 1, mode: INPUT_PULLUP }
    cc: 30
    steps_per_detent: 2
  - { id: enc_mcu, name: Enc MCU, pin_a: { number: GPIO7, mode: INPUT_PULLUP }, pin_b: { number: GPIO44, mode: INPUT_PULLUP }, cc: 31 }

key_matrix:
  type: switch
  rows: [{ sn74hc595: rows595, number: 0 }, { sn74hc595: rows595, number: 1 },
         { sn74hc595: rows595, number: 2 }, { sn74hc595: rows595, number: 3 }]
  columns: [{ sn74hc165: cols165, number: 0 }, { sn74hc165: cols165, number: 1 }, { sn74hc165: cols165, number: 2 },
            { sn74hc165: cols165, number: 3 }, { sn74hc165: cols165, number: 4 }, { sn74hc165: cols165, number: 5 }]
  keys: 24
  first_note: 36

pads:
  - { id: pad_1, pin: { cd74hc4067: knobs, number: 1 }, note: 36 }
  - { id: pad_2, name: Snare, pin: { cd74hc4067: knobs, number: 2, inverted: true }, note: 38 }
  - { id: pad_3, pin: { cd74hc4051: faders, number: 1 }, note: 42 }

pad_settings:
  channel: 10
  curve: soft
  aftertouch: true
  threshold: 300
  release: 150
  full: 3500
  window: 2ms
  retrigger: 30ms

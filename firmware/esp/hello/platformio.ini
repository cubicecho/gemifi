; gemifi hello: first bring-up firmware for ESP32 / S2 / S3, on ESP-IDF (no controller core).
; Build: pio run -d firmware/esp/hello -e <env>   (platform/esp/README.md)
; SPDX-License-Identifier: MIT

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
; the sdkconfig fragments and the gemifi_esp component (../gemifi_esp.py)
extra_scripts = pre:../gemifi_esp.py
custom_gm_core = gsx
board_build.partitions = ../partitions.csv
monitor_speed = 115200

; classic ESP32: serial MIDI on the USB-UART, or BLE
[env:esp32]
board = esp32dev

; S2 / S3: native USB MIDI (TinyUSB); S3 also BLE
[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3]
board = esp32-s3-devkitc-1

# M-Audio Keystation Mini 32 MK3 with gemifi (Nuvoton NUC120LC1BN).
# Pins: research/devices/m-audio-keystation-mini32-mk3/analysis/hw-map.md
gemifi: 1
name: Keystation Mini 32
description: M-Audio Keystation Mini 32 MK3 (NUC120), 32 velocity keys, 7 buttons, volume knob
board_id: 0x0001
platform: nuvoton-nuc1xx
chip: NUC120LC1BN
usb: { vid: 0x1209, pid: 0x0002 }
scan_us: 250               # 125 = stock rate; our scan needs ~100 us of CPU, too close at 125
boot_combo: [Pitch down, Pitch up]

# Buttons: PA1..PA7, active-low, external pull-ups (NUC120 has no internal pulls).
buttons:
  - label: Sustain
    pin: 
      pin: PA1
      inverted: true
    action: cc_momentary
    number: 64
    led: Sustain LED
  - { label: Edit,       pin: { pin: PA2, inverted: true }, action: cc_toggle,    number: 80, led: Edit LED }
  - { label: Oct -,      pin: { pin: PA3, inverted: true }, action: octave_down,  led: Oct - LED }
  - { label: Oct +,      pin: { pin: PA4, inverted: true }, action: octave_up,    led: Oct + LED }
  - { label: Pitch down, pin: { pin: PA5, inverted: true }, action: bend_down }
  - { label: Pitch up,   pin: { pin: PA6, inverted: true }, action: bend_up }
  - { label: Mod,        pin: { pin: PA7, inverted: true }, action: cc_ramp,      number: 1 }

# LEDs: active-low. Octave LEDs are bicolour (second colour on the PWM pins).
leds:
  - { label: Sustain LED, pin: { pin: PA12, inverted: true } }
  - { label: Edit LED,    pin: { pin: PA13, inverted: true } }
  - { label: Oct - LED,   pin: { pin: PA10, inverted: true }, pin2: { pin: PA14, inverted: true } }
  - { label: Oct + LED,   pin: { pin: PA11, inverted: true }, pin2: { pin: PA15, inverted: true } }

analog:
  - { label: Volume, pin: PA0, cc: 7, raw_min: 32, raw_max: 4064 }

# 8 drive rows (active-high) x 8 sense columns (external pull-downs),
# two contacts per key.
key_matrix:
  kind: velocity
  rows: [PA8, PA9, PC0, PC1, PC2, PC3, PC6, PC7]
  cols: [PB0, PB1, PB2, PB3, PB4, PB5, PB8, PB12]
  keys: 32
  first_note: 48
  settle_us: 1

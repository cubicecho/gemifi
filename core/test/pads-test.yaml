# Test device for core/test/test_pads.c: velocity pads on two muxes that
# share their select lines with a fader mux (as on the Code 61), and one pad
# on an ADC pin with inverted:. Not a real board. pads-hw-test.yaml is the
# same board with hardware_scan: { analog: true } (keep the two in step).
gemifi: 2
name: pads-test
friendly_name: Pads Test
board_id: 0x3F11
platform: stm32f1
chip: STM32F103RB
usb: { vid: 0x1209, pid: 0x0002 }
scan_interval: 500us

cd74hc4051:
  - id: fader_mux
    pin_s0: { number: PC0, allow_other_uses: true }
    pin_s1: { number: PC1, allow_other_uses: true }
    pin_s2: { number: PC2, allow_other_uses: true }
    common_pin: PA7
    delay: 10us
  - id: mux_a
    pin_s0: { number: PC0, allow_other_uses: true }
    pin_s1: { number: PC1, allow_other_uses: true }
    pin_s2: { number: PC2, allow_other_uses: true }
    common_pin: PA0
    delay: 10us
  - id: mux_b
    pin_s0: { number: PC0, allow_other_uses: true }
    pin_s1: { number: PC1, allow_other_uses: true }
    pin_s2: { number: PC2, allow_other_uses: true }
    common_pin: PA1
    delay: 10us

# A 4-wire XY pad on the Code 61's pins: read in software (the hardware
# scan, in pads-hw-test.yaml, leaves it out of its plan).
xy_pad:
  - { id: xy, x_plus_pin: PB1, x_minus_pin: PC5, y_plus_pin: PC4, y_minus_pin: PB10 }

analog:
  - { id: fader, pin: { cd74hc4051: fader_mux, number: 3 }, cc: 20, touch: movement }
  - { id: xy_x, pin: { xy_pad: xy, number: x }, cc: 16, adc_min: 592, adc_max: 3408 }
  - { id: xy_y, pin: { xy_pad: xy, number: y }, cc: 17, adc_min: 592, adc_max: 3408 }

pads:                                  # 0..7 on mux_a, 8..15 on mux_b, 16 direct
  - { id: pad_1,  pin: { cd74hc4051: mux_a, number: 0 }, note: 36, led: pad_1_led }
  - { id: pad_2,  pin: { cd74hc4051: mux_a, number: 1 }, note: 37 }
  - { id: pad_3,  pin: { cd74hc4051: mux_a, number: 2 }, note: 38 }
  - { id: pad_4,  pin: { cd74hc4051: mux_a, number: 3 }, note: 39 }
  - { id: pad_5,  pin: { cd74hc4051: mux_a, number: 4 }, note: 40 }
  - { id: pad_6,  pin: { cd74hc4051: mux_a, number: 5 }, note: 41 }
  - { id: pad_7,  pin: { cd74hc4051: mux_a, number: 6 }, note: 42 }
  - { id: pad_8,  pin: { cd74hc4051: mux_a, number: 7 }, note: 43 }
  - { id: pad_9,  pin: { cd74hc4051: mux_b, number: 0 }, note: 44 }
  - { id: pad_10, pin: { cd74hc4051: mux_b, number: 1 }, note: 45 }
  - { id: pad_11, pin: { cd74hc4051: mux_b, number: 2 }, note: 46 }
  - { id: pad_12, pin: { cd74hc4051: mux_b, number: 3 }, note: 47 }
  - { id: pad_13, pin: { cd74hc4051: mux_b, number: 4 }, note: 48 }
  - { id: pad_14, pin: { cd74hc4051: mux_b, number: 5 }, note: 49 }
  - { id: pad_15, pin: { cd74hc4051: mux_b, number: 6 }, note: 50 }
  - { id: pad_16, pin: { cd74hc4051: mux_b, number: 7 }, note: 51 }
  - { id: direct, pin: { number: PA2, inverted: true }, note: 60 }

# A pad layer (modes: layer:): while the grid mode is on (the grid button
# toggles it), pads 1 and 2 are their twins: EVENTs, no notes. Modes need a
# key matrix: one key on PB12 / PB13.
key_matrix: { type: switch, rows: [PB12], columns: [PB13], keys: 1, first_note: 72 }
buttons:
  - { id: grid, pin: PB14 }
leds:
  - { id: pad_1_led, pin: PB15 }
modes:
  - id: grid
    toggle: { button: grid }
    layer:
      pad_1: { daw: clip_1_1 }
      pad_2: { daw: clip_2_1, name: Clip 2 }

pad_settings:
  channel: 10
  threshold: 200
  release: 100
  full: 3000
  window: 3ms
  retrigger: 20ms

presets:
  list:
    - name: Default
    - name: Kit 2
      pads: { pad_1: { note: 70 } }
      pad_settings: { curve: hard, channel: 0 }

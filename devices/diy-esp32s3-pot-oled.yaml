# yaml-language-server: $schema=https://cubicecho.github.io/gemifi/schema/device.json
# DIY test device: an ESP32-S3-WROOM-1 (ESP32-S3-DevKitC-1), one 10k pot and a 0.96" 128x64 SSD1306
# I2C OLED. The same as diy-esp32-pot-oled, with native USB MIDI.
#
# Wiring (core/README.md "SSD1306 and SH1106 OLEDs"):
#   pot:  one end to 3V3, the other to GND, the wiper to GPIO1 (ADC1)
#   OLED: VCC to 3V3, GND to GND, SDA to GPIO8, SCL to GPIO9 (the module has its pull-ups)
#   USB:  the DevKitC-1's port marked USB (GPIO19 / GPIO20), not the one marked UART
gemifi: 2
name: diy-esp32s3-pot-oled
friendly_name: DIY S3 Pot + OLED
description: ESP32-S3 DevKitC-1 test device, USB MIDI, 1 pot (CC 7), a 128x64 SSD1306 OLED
board_id: 0x3F1A               # 0x3F00-0x3FFF: DIY / private (protocol/sysex.md section 7)
platform: esp32s3
chip: esp32-s3-devkitc-1       # PlatformIO board id
usb: { vid: 0x1209, pid: 0x0002 }
midi: { transport: usb }
scan_interval: 1ms

i2c: { sda: GPIO8, scl: GPIO9 }

ssd1306:
  - id: oled
    address: 0x3C              # 0x78 on the board's silkscreen is the same address, 8-bit
    # model: sh1106            # for the 1.3" modules
    # rotate: 180              # if the text is upside down

analog:
  - { id: pot, name: Param 1, daw: device_param_1, pin: GPIO1, cc: 7 }

# daw: roles are for a host with a gemifi driver (Zynthian: hosts/zynthian/README.md); without one
# the pot is CC 7 and the displays show their own (shows:).
displays:
  # big: the last MIDI message ("7 127" as the pot turns) and the device's messages; with the
  # Zynthian driver, the parameter the pot moves ("Cut 64"), else the selected chain's name
  - { id: oled_main, ssd1306: oled, line: 1, scale: 2, shows: last_message, daw: param }
  # small, along the bottom: the MIDI channel; with the Zynthian driver, the selected chain's name
  - { id: oled_channel, ssd1306: oled, line: 6, shows: channel, daw: track_name }

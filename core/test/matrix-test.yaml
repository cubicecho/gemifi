# Test device for core/test/test_matrix.c: a Code 61-style matrix, and a
# button layer (modes: layer:, toggled with Shift held).
# matrix-hw-test.yaml is the same board on stm32f1 with hardware_scan:, for
# the hardware-scan build of the same test. A decoder
# hub selects the rows (3 address lines, 3 groups on 2 enable lines), the keys
# have their two contacts on row pairs with a descending key map, and buttons
# plus an encoder sit on a switch matrix that shares the key columns. Not a
# real board; the pins only need to be distinct for the simulated HAL.
gemifi: 2
name: matrix-test
friendly_name: Matrix Test
board_id: 0x3F11
platform: nuvoton-nuc1xx
chip: NUC120LC1BN
usb: { vid: 0x1209, pid: 0x0002 }
scan_interval: 250us

decoder:
  - id: rows
    address: [PA2, PA3, PA4]
    groups:
      - { PA5: 1, PA6: 0 }     # outputs 0-7
      - { PA5: 0, PA6: 1 }     # outputs 8-15
      - { PA5: 0, PA6: 0 }     # outputs 16-23

switch_matrix:
  - id: panel
    rows: { decoder: rows, first: 16, count: 2 }
    rows_per_scan: 1           # read the two rows in turn
    columns:
      - { number: PB0, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB1, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB2, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
      - { number: PB3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }

key_matrix:
  type: velocity
  contacts: rows
  rows: { decoder: rows, first: 0, count: 4 }
  columns:
    - { number: PB0, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB1, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB2, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
    - { number: PB3, mode: INPUT_PULLUP, inverted: true, allow_other_uses: true }
  keys: 8
  first_note: 36
  key_map:                     # descending, like the Code 61's keybed
    - [7, 6, 5, 4]             # rows 0/1
    - [3, 2, 1, 0]             # rows 2/3

buttons:
  - { id: up,   pin: { switch_matrix: panel, number: 0 }, action: cc_momentary, cc: 20 }
  - { id: down, pin: { switch_matrix: panel, number: 1 }, action: cc_momentary, cc: 21 }
  - { id: chan, pin: { switch_matrix: panel, number: 2 }, led: chan_led }   # holds the channel mode
  - { id: shift, pin: { switch_matrix: panel, number: 3 }, action: cc_momentary, cc: 22 }
  - { id: lmode, pin: { switch_matrix: panel, number: 6 }, action: cc_momentary, cc: 23 }   # Shift + it: the arm layer
  - { id: mute, pin: { switch_matrix: panel, number: 7 }, action: cc_toggle, cc: 24, led: mute_led }

leds:
  - { id: chan_led, pin: PC0 }
  - { id: mute_led, pin: PC1, pin2: PC2, active: colour1 }
  - { id: arm_led, pin: PC3 }

# While chan is held, up / down change the channel; the keys keep playing.
modes:
  - id: channel
    hold: { button: chan }
    buttons: { up: channel_up, down: channel_down }
  # Shift + lmode switches the arm layer on and off (lmode alone: CC 23); in
  # it, mute is its twin: CC 25, its own toggle state, colour 2 on the LED;
  # lmode and the encoder have twins too.
  - id: arm
    toggle: { button: lmode, with: shift }
    led: arm_led
    layer:
      mute: { cc: 25, daw: arm_1, active: colour2 }
      lmode: { cc: 26 }              # lmode alone in the layer: CC 26; Shift + it still leaves
      enc: { cc: 31, daw: pan_1 }    # the encoder's twin: CC 31

encoders:
  - { id: enc, pin_a: { switch_matrix: panel, number: 4 }, pin_b: { switch_matrix: panel, number: 5 }, cc: 30 }

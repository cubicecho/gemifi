# Test device for core/test/test_seg_hubs.c: a chain of two MAX7219s and a
# TM1637, each with a 7-segment display on it, plus an LED on the second
# MAX7219. Not a real board; the pins only need to be distinct for the
# simulated HAL.
gemifi: 2
name: seg-hubs-test
friendly_name: Segment Hubs Test
board_id: 0x3F16
platform: stm32f1
chip: STM32F103RB
usb: { vid: 0x1209, pid: 0x0002 }
scan_interval: 500us

max7219:
  - { id: mx, clk_pin: PA5, din_pin: PA7, cs_pin: PA4, num_chips: 2, intensity: 8, scan_limit: 3 }
tm1637:
  - { id: t37, clk_pin: PB6, dio_pin: PB7, length: 4, intensity: 2 }

buttons:
  - { id: p1, pin: { number: PB0, mode: INPUT_PULLUP, inverted: true }, action: preset_select, preset: 1 }
  - { id: p2, pin: { number: PB1, mode: INPUT_PULLUP, inverted: true }, action: preset_select, preset: 2 }
  - { id: btn, pin: { number: PB2, mode: INPUT_PULLUP, inverted: true }, action: cc_toggle, cc: 80, led: btn_led }

leds:
  - { id: btn_led, pin: { max7219: mx, number: 64 } }     # chip 1, digit 0, segment A

displays:
  - id: number                 # chip 0, DIG0..DIG2, left to right
    type: segment7
    shows: preset_number
    chars:
      - { max7219: mx, number: 0 }
      - { max7219: mx, number: 8 }
      - { max7219: mx, number: 16 }
  - id: text
    type: segment7
    shows: last_message
    chars:
      - { tm1637: t37, number: 0 }
      - { tm1637: t37, number: 8 }
      - { tm1637: t37, number: 16 }
      - { tm1637: t37, number: 24 }

presets:
  slots: 3
  list:
    - { name: Clean, program: 0 }
    - { name: Lead, program: 1 }

analog:
  - { id: knob, pin: PA0, cc: 7 }

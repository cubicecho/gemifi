# The tests. Release (release.yml) runs after this passes on main, so a red run never
# becomes a version.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-c:
    name: Builder, core, host tools, host-sim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # arm-none-eabi-gcc: the firmware and bootloader builds, and host-sim, which links a real
      # NUC firmware image (hello-led.gfw). From Arm's releases, cached between runs, instead of
      # apt: the Ubuntu mirror download hung for 20 minutes more than once. 14.2.Rel1 is the
      # version the Ubuntu package on dev machines has. make is already on the runner image.
      - name: Arm toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        timeout-minutes: 5
        with:
          release: "14.2.Rel1"

      - name: Python packages
        run: |
          arm-none-eabi-gcc --version | head -1
          make --version | head -1
          pip install pyyaml==6.0.3 pytest

      - name: Builder
        working-directory: tools/builder
        run: python -m pytest -q tests

      # The device YAML's JSON schema is generated from the validator: a validator change without a
      # regenerated site/src/schema/device.json fails here (the site publishes that file).
      - name: Device YAML schema up to date
        run: python tools/builder/gemifi_build.py schema --check site/src/schema/device.json

      - name: Core
        run: make -C core/test test

      - name: Host tools
        working-directory: tools/host
        run: python -m unittest discover -s tests -t .

      # The protocol test vectors are generated from the host codec: a codec change without a
      # regenerated protocol/test-vectors.json fails here.
      - name: Test vectors up to date
        working-directory: tools/host
        run: python make_test_vectors.py --check

      - name: Ableton Live script
        working-directory: hosts/ableton-live
        run: python -m pytest -q

      - name: STM32F1 config store (simulated flash)
        run: make -C platform/stm32f1/test/cs-test test

      - name: STM32F1 bootloader boot decision (boot-loop guard)
        run: make -C platform/stm32f1/test/boot-sim test

      - name: NUC host-sim (bootloader, app, end to end)
        run: make -C platform/nuvoton-nuc1xx/test/host-sim test

  bitwig:
    name: Bitwig extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hosts/bitwig
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: hosts/bitwig/pom.xml

      # Its protocol tests read protocol/test-vectors.json, so a protocol change that breaks the
      # extension fails here.
      - run: mvn -B -ntp package

  web:
    name: Web updater
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/updater
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/updater/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build

# Example ESP32-S3 USB MIDI controller (gemifi ESP platform reference).
# The default device of firmware/esp/midi-controller (esp32s2 / esp32s3).
# Pins are for an ESP32-S3-DevKitC-1.
gemifi: 2
name: esp32-example
friendly_name: ESP32 Example
description: ESP32-S3 example, 4 buttons, 1 LED, 2 pots, 1 encoder, 8 faders on a 74HC4051
board_id: 0x3F01               # 0x3F00-0x3FFF: DIY / private
platform: esp32s3
chip: esp32-s3-devkitc-1       # PlatformIO board id
usb: { vid: 0x1209, pid: 0x0002 }
midi: { transport: usb }
scan_interval: 500us
boot_combo: [button_1, button_4]

cd74hc4051:
  - id: faders
    pin_s0: GPIO4
    pin_s1: GPIO5
    pin_s2: GPIO6
    common_pin: GPIO1          # ADC1
    delay: 5us

buttons:
  - { id: button_1, pin: { number: GPIO9,  mode: INPUT_PULLUP, inverted: true }, action: cc_toggle, cc: 80, led: led }
  - { id: button_2, pin: { number: GPIO10, mode: INPUT_PULLUP, inverted: true }, action: cc_momentary, cc: 64 }
  - { id: button_3, pin: { number: GPIO11, mode: INPUT_PULLUP, inverted: true }, action: octave_down }
  - { id: button_4, pin: { number: GPIO12, mode: INPUT_PULLUP, inverted: true }, action: octave_up }

leds:
  - { id: led, pin: GPIO21 }

analog:
  - { id: pot_1, pin: GPIO7, cc: 7 }      # ADC1
  - { id: pot_2, pin: GPIO8, cc: 10 }     # ADC1
  - { id: fader_1, pin: { cd74hc4051: faders, number: 0 }, cc: 20 }
  - { id: fader_2, pin: { cd74hc4051: faders, number: 1 }, cc: 21 }
  - { id: fader_3, pin: { cd74hc4051: faders, number: 2 }, cc: 22 }
  - { id: fader_4, pin: { cd74hc4051: faders, number: 3 }, cc: 23 }
  - { id: fader_5, pin: { cd74hc4051: faders, number: 4 }, cc: 24 }
  - { id: fader_6, pin: { cd74hc4051: faders, number: 5 }, cc: 25 }
  - { id: fader_7, pin: { cd74hc4051: faders, number: 6 }, cc: 26 }
  - { id: fader_8, pin: { cd74hc4051: faders, number: 7 }, cc: 27 }

encoders:
  - id: encoder
    pin_a: { number: GPIO15, mode: INPUT_PULLUP }
    pin_b: { number: GPIO16, mode: INPUT_PULLUP }
    cc: 30
    steps_per_detent: 4

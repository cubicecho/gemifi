# yaml-language-server: $schema=https://cubicecho.github.io/gemifi/schema/device.json
# M-Audio Keystation Mini 32 MK3 with gemifi (Nuvoton NUC120LC1BN).
# Pins: research/devices/m-audio-keystation-mini32-mk3/analysis/hw-map.md
gemifi: 2
name: keystation-mini32
friendly_name: Keystation Mini 32
description: M-Audio Keystation Mini 32 MK3 (NUC120), 32 velocity keys, 7 buttons, volume knob
project:
  version: 0.1.9            # firmware version, shown in HELLO and the .gfw header
board_id: 0x0001
platform: nuvoton-nuc1xx
chip: NUC120LC1BN
usb: { vid: 0x1209, pid: 0x0002 }
scan_interval: 125us       # stock rate; the scan takes ~20 us of it
boot_combo: [pitch_down, pitch_up]
# Recovery (core/README.md "Factory-reset combo", "Physical unlock", "Status LED"):
# Oct - + Oct + held at power-up for 5 s wipe the settings (not the firmware). The Edit
# LED shows the blink codes. The physical unlock is off. With the line below, uploads,
# reboot to the bootloader and factory reset over SysEx wait until Pitch down + Pitch up
# (the boot_combo) are held for 2 s; the Edit LED blinks fast meanwhile.
factory_reset_combo: [oct_down, oct_up]
# unlock: { combo: [pitch_down, pitch_up] }
status_led: edit_led

# Buttons: PA1..PA7, active-low, external pull-ups (NUC120 has no internal pulls).
# The names show in the web config page and are the CLI's index keys (button.action:Oct -);
# without name: the name comes from the id (pitch_down -> "Pitch down").
buttons:
  - id: sustain
    pin:
      number: PA1
      inverted: true
    action: cc_momentary
    cc: 64
    led: sustain_led
  - { id: edit,       pin: { number: PA2, inverted: true }, led: edit_led }     # the edit mode (modes: below)
  - { id: oct_down,   name: Oct -, pin: { number: PA3, inverted: true }, action: octave_down, led: oct_down_led }
  - { id: oct_up,     name: Oct +, pin: { number: PA4, inverted: true }, action: octave_up,   led: oct_up_led }
  - { id: pitch_down, pin: { number: PA5, inverted: true }, action: bend_down }
  - { id: pitch_up,   pin: { number: PA6, inverted: true }, action: bend_up }
  - { id: mod,        pin: { number: PA7, inverted: true }, action: cc_ramp,     cc: 1 }

# LEDs: active-low. Octave LEDs are bicolour (second colour on the PWM pins).
leds:
  - { id: sustain_led,  pin: { number: PA12, inverted: true } }
  - { id: edit_led,     pin: { number: PA13, inverted: true } }
  - { id: oct_down_led, pin: { number: PA10, inverted: true }, pin2: { number: PA14, inverted: true } }
  - { id: oct_up_led,   pin: { number: PA11, inverted: true }, pin2: { number: PA15, inverted: true } }

analog:
  - { id: volume, pin: PA0, cc: 7, adc_min: 32, adc_max: 4064 }

# 8 drive rows (active-high) x 8 sense columns (external pull-downs),
# two contacts per key.
key_matrix:
  type: velocity
  rows: [PA8, PA9, PC0, PC1, PC2, PC3, PC6, PC7]
  columns: [PB0, PB1, PB2, PB3, PB4, PB5, PB8, PB12]
  keys: 32
  first_note: 48
  settle: 1us
  # Key times for velocity 127 and 1, tuned on this keybed (2026-10-31):
  # soft playing 21-54 ms, normal 3-7 ms, hard 1.2-2.5 ms between contacts.
  # 2.0/80 felt hot at the top and too quiet at the bottom.
  velocity: { fast: 1.6ms, slow: 120ms }

# Presets (core/README.md "Presets"): slot 1 is everything above; the others list only what
# they change. Slots 4-8 start as copies of slot 1, to fill in from the web editor.
presets:
  slots: 8
  list:
    - name: Default
    - name: Drums
      midi: { channel: 10 }
      velocity: { curve: hard }
      buttons:
        sustain: { action: note, note: 36 }      # kick
        mod:     { action: note, note: 38 }      # snare
    - name: DAW
      buttons:
        sustain: { cc: 66 }                      # sostenuto, still momentary
        mod:     { action: cc_toggle, cc: 82 }
      analog:
        volume: { cc: 11 }                       # expression

# Edit mode (core/README.md "Modes"): Edit turns the keys into function keys (no notes) until it is
# pressed again; its LED is lit meanwhile. Keys are named by their note at octave 0: the lowest key
# is C3. E3, then a white key from D4, picks preset 1..8 (the Edit LED blinks while it waits); A3,
# then a key from C4, picks MIDI channel 1..16. After a preset switch, Oct - blinks the preset
# number, then both octave LEDs flash.
modes:
  - id: edit
    toggle: { button: edit }
    led: edit_led
    preset_blink: [oct_down_led, oct_up_led]
    keys:
      C3: octave_reset
      C#3: octave_down
      D3: transpose_reset
      D#3: octave_up
      E3: { mode: preset_pick }
      F3: preset_prev
      G3: preset_next
      A3: { mode: channel_pick }
      C5: { action: velocity_curve, curve: normal }
      D5: { action: velocity_curve, curve: soft }
      E5: { action: velocity_curve, curve: hard }
      F5: { action: velocity_curve, curve: fixed }
  - id: preset_pick
    parent: edit                 # one pick, then back to edit mode
    led: { edit_led: blink }
    keys: { white_from: D4, action: preset_select }     # D4 E4 F4 G4 A4 B4 C5 D5 = presets 1..8
  - id: channel_pick
    parent: edit
    led: { edit_led: blink }
    keys: { from: C4, action: channel }                  # C4..D#5 = channels 1..16

# Where the controls are, for the web page's drawing (core/README.md "Layout"): units of about
# 5 mm from the top left. The keys go under the controls by themselves. Approximate.
layout:
  controls:
    volume:     { x: 1, y: 1, w: 4, h: 4 }
    oct_down:   [7, 2]
    oct_up:     [11, 2]
    pitch_down: [16, 2]
    pitch_up:   [20, 2]
    mod:        [25, 2]
    sustain:    [30, 2]
    edit:       [35, 2]

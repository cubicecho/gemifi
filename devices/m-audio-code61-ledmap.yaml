# M-Audio Code 61: LED bit-mapping firmware. Temporary: for finding which
# TM1628 RAM bit lights which LED or display segment (core/README.md
# "TM1628 LED drivers"). Every RAM bit is an LED that only the host drives:
#   chip A (leds_a) bit n = a_<n> = Note n on channel 1 (n = 0..111),
#   chip B (leds_b) bit n = b_<n> = Note n on channel 2 (n = 0..47),
# bit n = RAM byte n / 8, bit n % 8. Light them from the web app's
# host-feedback card (Off / Blink / On per LED) or with Note On from any
# MIDI tool. The tm1628: section is a copy of devices/m-audio-code61.yaml's;
# the leds: list was generated (one line per bit). Sustain and the master
# fader are here only so the device has inputs.
gemifi: 2
name: m-audio-code61
friendly_name: Code 61 LED map
description: "M-Audio Code 61: every TM1628 RAM bit as a host-driven LED, for mapping the LEDs"
project:
  version: 0.2.15
board_id: 0x0002
platform: stm32f1
chip: STM32F103RB
usb: { vid: 0x1209, pid: 0x0002 }
scan_interval: 200us

# LED drivers: two TM1628-class chips, bit-banged, sharing CLK and DIO, each
# with its own STB [sure]. Together they drive every LED and the 6-character
# display. A pin on them is a RAM bit: number = byte * 8 + bit. PA15 is a
# JTAG pin at reset; the board config turns JTAG off (BOARD_SWJ_NOJTAG, SWD
# stays on). grids: and intensity: are left at their defaults [guess].
tm1628:
  - id: leds_a             # 14 RAM bytes, the TM1628 size [sure]
    clk_pin: { number: PC10, allow_other_uses: true }
    dio_pin: { number: PC11, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: PA15
    ram_bytes: 14
  - id: leds_b             # 6 RAM bytes: the 48 bits of the RGB button LEDs [sure]
    clk_pin: { number: PC10, allow_other_uses: true }
    dio_pin: { number: PC11, mode: OUTPUT_OPEN_DRAIN, allow_other_uses: true }
    stb_pin: PC12
    ram_bytes: 6

buttons:
  - id: sustain
    pin: { number: PC9, mode: INPUT_PULLUP, inverted: true }
    action: cc_momentary
    cc: 64

analog:
  - { id: master, pin: PA6, cc: 7, adc_min: 80, adc_max: 4000 }

leds:
  - { id: a_0, pin: { tm1628: leds_a, number: 0 }, feedback: { note: 0 } }
  - { id: a_1, pin: { tm1628: leds_a, number: 1 }, feedback: { note: 1 } }
  - { id: a_2, pin: { tm1628: leds_a, number: 2 }, feedback: { note: 2 } }
